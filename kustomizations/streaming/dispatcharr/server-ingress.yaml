apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dispatcharr
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: dispatcharr.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: dispatcharr
              port:
                number: 9191