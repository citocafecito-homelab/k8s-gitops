apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant-local
spec:
  rules:
  - host: homeassistant.lan
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: home-assistant
              port:
                number: 8123
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: home-assistant
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: home.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: home-assistant
              port:
                number: 8123