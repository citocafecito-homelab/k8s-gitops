apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kite
---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: kite
  namespace: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kite
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kite
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kite
    spec:
      serviceAccountName: kite
      containers:
        - name: kite
          image: ghcr.io/kite-org/kite:v0.13.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_TYPE
              value: sqlite
            - name: DB_DSN
              value: /data/kite.db
            - name: ANONYMOUS_USER_ENABLED
              value: 'true'
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          volumeMounts:
            - name: kite-storage
              mountPath: /data
      nodeSelector:
        kubernetes.io/hostname: catuai
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      volumes:
        - name: kite-storage
          hostPath:
            path: /mnt/kite
            type: DirectoryOrCreate
---
kind: Service
apiVersion: v1
metadata:
  name: kite
  namespace: monitoring
spec:
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/instance: kite
    app.kubernetes.io/name: kite
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kite
  namespace: monitoring
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: kite.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kite
            port:
              number: 8080