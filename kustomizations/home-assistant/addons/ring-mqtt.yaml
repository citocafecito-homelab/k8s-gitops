apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ring-mqtt
  labels:
    app: ring-mqtt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ring-mqtt
      app.kubernetes.io/name: ring-mqtt
      app.kubernetes.io/part-of: home-assistant
  serviceName: ring-mqtt
  template:
    metadata:
      labels:
        app: ring-mqtt
        app.kubernetes.io/name: ring-mqtt
        app.kubernetes.io/part-of: home-assistant
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: vault
        vault.hashicorp.com/secret-volume-path: "/data"
        
        vault.hashicorp.com/agent-inject-secret-config.json: "secret/data/ring"
        vault.hashicorp.com/agent-inject-template-config.json: |
          {{- with secret "secret/data/ring" -}}
          {
            "mqtt_url": "mqtt://mosquitto:1883",
            "mqtt_user": "",
            "mqtt_pass": "",
            "ring_username": "{{ .Data.data.USERNAME }}",
            "ring_password": "{{ .Data.data.PASSWORD }}",
            "enable_modes": false,
            "discovery": true,
            "log_level": "info",
            "livestream_user": "{{ .Data.data.CAMERA_USERNAME }}",
            "livestream_pass": "{{ .Data.data.CAMERA_PASSWORD }}",
            "enable_cameras": true,
            "mqtt_client_id": "ring-mqtt"
          }
          {{- end }}
        
        vault.hashicorp.com/agent-inject-secret-ring-state.json: "secret/data/ring"
        vault.hashicorp.com/agent-inject-template-ring-state.json: |
          {{- with secret "secret/data/ring" -}}
            {
              "ring_token": "{{ .Data.data.TOKEN }}",
              "systemId": "{{ .Data.data.SYSTEM_ID }}",
              "devices": {
                  "5c475e0dde74": {
                      "snapshot": {
                          "mode": "Auto",
                          "autoInterval": true,
                          "interval": 600
                      },
                      "event_select": {
                          "state": "Motion 1"
                      },
                      "motion": {
                          "duration": 180
                      },
                      "ding": {
                          "duration": 180
                      }
                  }
              }
            }
          {{- end }}
    spec:
      containers:
      - name: ring-mqtt
        image: tsightler/ring-mqtt:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 51824
          name: web-ui
        - containerPort: 55123
          name: auth-ui
        - containerPort: 8554
          name: rtsp
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
---
apiVersion: v1 
kind: Service
metadata:
  name: ring-mqtt
spec:
  selector:
    app: ring-mqtt
  type: ClusterIP
  ports:
  - protocol: TCP
    port: 51824
    targetPort: 51824
    name: web-ui
  - protocol: TCP
    port: 55123
    targetPort: 55123
    name: auth-ui
  - protocol: TCP
    port: 8554
    targetPort: 8554
    name: rtsp
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ring-mqtt
spec:
  rules:
  - host: ringmqtt.lan
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: ring-mqtt
              port:
                number: 55123
