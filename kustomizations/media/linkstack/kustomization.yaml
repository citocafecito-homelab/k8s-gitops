apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: linkstack-

components:
  - ../../../components/valkey
  - ../../../components/mysql

labels:
  - pairs:
      app.kubernetes.io/part-of: linkstack
    includeSelectors: false

resources:
- config.yaml
- pvc.yaml
- deployment.yaml
- svc.yaml
- ingress.yaml

patches:
  - target:
      kind: PersistentVolume
      name: mysql-pv
    patch: |-
      - op: replace
        path: /spec/hostPath/path
        value: /mnt/linkstack-mysql

  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: mysql
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-secret-database
        value: "secret/data/linkstack"
      - op: replace
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-template-database
        value: |-
          {{- with secret "secret/data/linkstack" -}}
          {{ .Data.data.DATABASE_NAME | writeToFile "/vault/secrets/database" "vault" "vault" "0644" }}
          {{ .Data.data.DATABASE_USERNAME | writeToFile "/vault/secrets/username" "vault" "vault" "0644" }}
          {{ .Data.data.DATABASE_PASSWORD | writeToFile "/vault/secrets/password" "vault" "vault" "0644" }}
          {{- end -}}

