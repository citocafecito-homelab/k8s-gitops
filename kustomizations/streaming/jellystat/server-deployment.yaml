apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellystat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellystat
      app.kubernetes.io/name: jellystat
  template:
    metadata:
      labels:
        app: jellystat
        app.kubernetes.io/name: jellystat
      annotations:
        app.kubernetes.io/documentation: "https://github.com/CyferShepard/Jellystat"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: vault
        vault.hashicorp.com/agent-inject-secret-jellystat: "secret/data/jellystat"
        vault.hashicorp.com/agent-inject-template-jellystat: |
          {{- with secret "secret/data/jellystat" -}}
          {{ .Data.data.JWT_SECRET | writeToFile "/vault/secrets/jwt" "vault" "vault" "0600" }}
          {{ .Data.data.ADMIN_USER | writeToFile "/vault/secrets/user" "vault" "vault" "0600" }}
          {{ .Data.data.ADMIN_PASS | writeToFile "/vault/secrets/password" "vault" "vault" "0600" }}
          {{- end -}}
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      initContainers:
      - name: wait-for-postgres
        image: postgres:17-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h jellystat-postgresql -p 5432 -U $POSTGRES_USER; do
            echo "Esperando a que PostgreSQL esté listo..."
            sleep 2
          done
        envFrom:
        - configMapRef:
            name: jellystat-database
      containers:
      - name: jellystat
        image: ghcr.io/cyfershepard/jellystat:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: jellystat-database
        - configMapRef:
            name: jellystat-config
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
      securityContext:
        fsGroup: 1000
        sysctls:
        - name: net.ipv4.tcp_keepalive_time
          value: "120"
        - name: net.ipv4.tcp_keepalive_intvl
          value: "60"
        - name: net.ipv4.tcp_keepalive_probes
          value: "6"
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule