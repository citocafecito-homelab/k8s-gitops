apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatcharr
  labels:
    app: dispatcharr
    app.kubernetes.io/name: dispatcharr
    app.kubernetes.io/instance: streaming-stack
    app.kubernetes.io/part-of: streaming-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatcharr
      app.kubernetes.io/name: dispatcharr
      app.kubernetes.io/instance: streaming-stack
      app.kubernetes.io/part-of: streaming-stack
  template:
    metadata:
      labels:
        app: dispatcharr
        app.kubernetes.io/name: dispatcharr
        app.kubernetes.io/instance: streaming-stack
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: dispatcharr
        image: ghcr.io/dispatcharr/dispatcharr:latest
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        - configMapRef:
            name: dispatcharr-config
        env:
        - name: DISPATCHARR_PORT
          value: "9191"
        ports:
        - containerPort: 9191
        - containerPort: 5656
        - containerPort: 8001
        securityContext:
          privileged: true
          capabilities:
            add:
             - SYS_NICE
             - SYS_RAWIO
        volumeMounts:
        - mountPath: /dev/dri
          name: dri
        - mountPath: /data
          name: dispatcharr-data
      nodeSelector:
        kubernetes.io/hostname: castillo
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: dispatcharr-data
        persistentVolumeClaim:
          claimName: dispatcharr-pvc