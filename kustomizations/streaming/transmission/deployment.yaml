apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: transmission
      app.kubernetes.io/name: transmission
  template:
    metadata:
      labels:
        app: transmission
        app.kubernetes.io/name: transmission
        app.kubernetes.io/part-of: streaming-stack
      annotations:
        app.kubernetes.io/documentation: "https://docs.linuxserver.io/images/docker-transmission/"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: vault
        vault.hashicorp.com/agent-inject-secret-transmission: "secret/data/transmission"
        vault.hashicorp.com/agent-inject-template-transmission: |
          {{- with secret "secret/data/transmission" -}}
          {{ .Data.data.USERNAME | writeToFile "/vault/secrets/user" "vault" "1000" "0640" }}
          {{ .Data.data.PASSWORD | writeToFile "/vault/secrets/password" "vault" "1000" "0640" }}
          {{- end -}}
    spec:
      dnsPolicy: ClusterFirst
      serviceAccountName: transmission
      containers:
      - name: gluetun
        image: qmcgaw/gluetun:latest
        env:
        - name: OPENVPN_USER
          valueFrom:
            secretKeyRef:
              name: pia-credentials
              key: VPN_SERVICE_USER
        - name: OPENVPN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pia-credentials
              key: VPN_SERVICE_PASSWORD
        envFrom:
        - configMapRef:
            name: vpn-config
        - configMapRef:
            name: transmission-auth
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        securityContext:
          runAsUser: 0
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        volumeMounts:
        - name: config
          mountPath: /config
        - name: scripts
          mountPath: /scripts
        - name: tun
          mountPath: /dev/net/tun

      - name: transmission
        image: lscr.io/linuxserver/transmission:latest
        ports:
        - containerPort: 9091
          name: webui
          protocol: TCP
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        - configMapRef:
            name: transmission-config
        - configMapRef:
            name: transmission-auth
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
        volumeMounts:
        - name: scripts
          mountPath: /custom-cont-init.d/01-setup-config.sh
          subPath: 01-setup-config.sh
        - name: scripts
          mountPath: /scripts
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
      nodeSelector:
        kubernetes.io/hostname: catimore
      securityContext:
        fsGroup: 1000
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
      - name: scripts
        projected:
          defaultMode: 0755
          sources:
          - configMap:
              name: transmission-scripts
          - configMap:
              name: shared-scripts
      - name: config
        hostPath:
          path: /mnt/transmission
          type: DirectoryOrCreate
      - name: watch
        hostPath:
          path: /mnt/transmission/watch
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc