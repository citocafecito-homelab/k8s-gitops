apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: dispatcharr
spec:
  scaleTargetRef:
    name: dispatcharr
    kind: Deployment
    apiVersion: apps/v1
    service: dispatcharr
    port: 9191
  replicas:
    min: 1
    max: 3
  scaledownPeriod: 300
  hosts:
    - dispatcharr.citocafecito.work
