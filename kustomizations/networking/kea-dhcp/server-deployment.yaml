
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kea-dhcp
  namespace: networking
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kea-dhcp
  template:
    metadata:
      labels:
        app: kea-dhcp
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # Contenedor Init para asegurar que las tablas de Kea existan en Postgres antes de iniciar
      initContainers:
      - name: init-kea-db
        image: jonathanm/kea-dhcp:latest
        command:
        - sh
        - -c
        - |
          kea-admin db-init postgres -u $POSTGRES_USER -p $POSTGRES_PASSWORD -h $POSTGRES_HOST -port $POSTGRES_PORT -name $POSTGRES_DB || true
        env:
        - name: POSTGRES_HOST
          value: "postgres.database.svc.cluster.local"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "kea"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: kea-db-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kea-db-secret
              key: password
      containers:
      - name: kea-dhcp4
        image: jonathanm/kea-dhcp:latest
        command: ["kea-dhcp4", "-c", "/etc/kea/kea-dhcp4.conf"]
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: kea-db-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kea-db-secret
              key: password
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE"]
        volumeMounts:
        - name: kea-config
          mountPath: /etc/kea
          readOnly: true
      - name: kea-dhcp6
        image: jonathanm/kea-dhcp:latest
        command: ["kea-dhcp6", "-c", "/etc/kea/kea-dhcp6.conf"]
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: kea-db-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: kea-db-secret
              key: password
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW", "NET_BIND_SERVICE"]
        volumeMounts:
        - name: kea-config
          mountPath: /etc/kea
          readOnly: true
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      volumes:
      - name: kea-config
        configMap:
          name: kea-dhcp-config