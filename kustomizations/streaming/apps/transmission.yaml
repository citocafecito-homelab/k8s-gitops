# IF ssh run 
# export TR_AUTH="$(cat /vault/secrets/user):$(cat /vault/secrets/pass)"
# alias tr='transmission-remote --authenv'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
      app.kubernetes.io/name: transmission
  template:
    metadata:
      labels:
        app: transmission
        app.kubernetes.io/name: transmission
        app.kubernetes.io/part-of: streaming-stack
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: vault
        vault.hashicorp.com/agent-inject-secret-creds: 'secret/data/transmission'
        vault.hashicorp.com/address: "http://vault.core.svc.cluster.local:8200"
        vault.hashicorp.com/agent-inject-template-creds: |
          {{- with secret "secret/data/transmission" -}}
          {{ .Data.data.USERNAME | writeToFile "/vault/secrets/user" "vault" "vault" "0600" }}
          {{ .Data.data.PASSWORD | writeToFile "/vault/secrets/pass" "vault" "vault" "0600" }}
          {{- end -}}
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: transmission
        image: lscr.io/linuxserver/transmission:latest
        ports:
        - containerPort: 9091
          protocol: TCP
        - containerPort: 51413
          protocol: TCP
        - containerPort: 51413
          protocol: UDP
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        env:
        - name: FILE__USER
          value: /vault/secrets/user
        - name: FILE__PASS
          value: /vault/secrets/pass
        - name: HOST_WHITELIST
          value: "0.0.0.0,192.168.1.0/24,127.0.0.1"
        - name: TR_LOG_LEVEL
          value: "3"
        - name: TR_ENFORCE_IPV4
          value: "true"
        - name: TR_PREFER_IPV4
          value: "true"
        - name: TR_PORT_FORWARDING_ENABLED
          value: "false"
        - name: TR_DNS_SERVERS
          value: "1.1.1.1,8.8.8.8"
        - name: PEERPORT
          value: "51413"
        - name: TR_INCOMPLETE_DIR_ENABLED
          value: "false"
        - name: TR_DOWNLOAD_DIR
          value: "/downloads"
        - name: TR_DOWNLOAD_QUEUE_ENABLED
          value: "false"
        - name: TR_SEED_QUEUE_ENABLED
          value: "false"
        - name: TR_QUEUE_STALLED_ENABLED
          value: "false"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - name: resume
          mountPath: /config/resume
        - name: torrents
          mountPath: /config/torrents
        - name: watch
          mountPath: /watch
        - name: downloads
          mountPath: /downloads
      nodeSelector:
        kubernetes.io/hostname: catuai
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      volumes:
      - name: resume
        hostPath:
          path: /mnt/transmission/resume
          type: DirectoryOrCreate
      - name: torrents
        hostPath:
          path: /mnt/transmission/torrents
          type: DirectoryOrCreate
      - name: watch
        hostPath:
          path: /mnt/transmission/watch
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
spec:
  selector:
    app: transmission
  ports:
  - name: webui
    port: 9091
    targetPort: 9091
    protocol: TCP
  - name: tcp
    port: 51413
    targetPort: 51413
    protocol: TCP
  - name: udp
    port: 51413
    targetPort: 51413
    protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: transmission-lb
  annotations:
    external-dns.alpha.kubernetes.io/hostname: transmission.lan
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.36
  ports:
  - name: webui
    port: 80
    targetPort: 9091
    protocol: TCP
  - name: tcp
    port: 51413
    targetPort: 51413
    protocol: TCP
  - name: udp
    port: 51413
    targetPort: 51413
    protocol: UDP
  selector:
    app: transmission