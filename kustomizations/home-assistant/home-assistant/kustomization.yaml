apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: home-assistant-packages
    files:
      - files/ingress.yaml
      - files/shell.yaml
      - files/templates.yaml
  - name: home-assistant-config
    files:
      - configuration.yaml=files/configuration.yaml

resources:
- pvc.yaml
- deployment.yaml
- ingress.yaml
- svc.yaml

namespace: home-assistant
