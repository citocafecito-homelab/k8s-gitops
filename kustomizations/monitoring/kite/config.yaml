---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database
data:
  DATABASE_HOST: "linkstack-mysql.media.svc.cluster.local"
  DATABASE_PORT: "3306"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: config
data:
  # Global
  ENABLE_ANALYTICS: "false"
  KITE_CONFIG_FILE: "/vault/secrets/config.yml"
    
  # Database
  # see https://kite.zzde.me/faq#persistence-issues
  DB_TYPE: "postgres"