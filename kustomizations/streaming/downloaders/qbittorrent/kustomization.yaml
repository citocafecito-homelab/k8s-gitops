apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: streaming

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: qbittorrent-port-updater
  files:
  - scripts/check-port-daemon.sh

resources:
- cronjobs/check-port.yaml
- server-deployment.yaml
- server-svc.yaml
- server-ingress.yaml