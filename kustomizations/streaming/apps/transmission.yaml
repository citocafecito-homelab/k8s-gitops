apiVersion: v1
kind: ConfigMap
metadata:
  name: transmission-hooks
data:
  on-complete.sh: |
    #!/bin/sh

    echo "Torrent finished:"
    echo "Dir:  $TR_TORRENT_DIR"
    echo "Name: $TR_TORRENT_NAME"

    TORRENT_PATH="$TR_TORRENT_DIR/$TR_TORRENT_NAME"
    echo "Full path: $TORRENT_PATH"

    # Solo procesamos si está dentro del directorio de Lidarr
    case "$TORRENT_PATH" in
      */lidarr/*) ;;
      *)
        echo "Not a Lidarr download, skipping"
        exit 0
        ;;
    esac

    echo "Creating split2flac Job in Kubernetes"

    kubectl create job split2flac-$(date +%s) \
      --image=mikenye/split2flac \
      -- /bin/sh -c "
        cd /workdir &&
        CUE=\$(find . -maxdepth 1 -iname '*.cue' | head -n1) &&
        [ -z \"\$CUE\" ] && echo 'No CUE found' && exit 0 &&
        FLACS=\$(find . -maxdepth 1 -iname '*.flac' | wc -l) &&
        [ \"\$FLACS\" -gt 1 ] && echo 'Already split' && exit 0 &&
        split2flac \"\$(basename \$CUE)\"
      "
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: transmission-config
data:
  settings.json: |
    {
      "download-dir": "/downloads",
      "incomplete-dir-enabled": false,
      "script-torrent-done-enabled": true,
      "script-torrent-done-filename": "/scripts/on-complete.sh"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
      app.kubernetes.io/name: transmission
  template:
    metadata:
      labels:
        app: transmission
        app.kubernetes.io/name: transmission
        app.kubernetes.io/part-of: streaming-stack
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: vault
        vault.hashicorp.com/agent-inject-secret-creds: 'secret/data/transmission'
        vault.hashicorp.com/address: "http://vault.core.svc.cluster.local:8200"
        vault.hashicorp.com/agent-inject-template-creds: |
          {{- with secret "secret/data/transmission " -}}
          USER="{{ .Data.data.USERNAME }}"
          PASS="{{ .Data.data.PASSWORD }}"
          {{ .Data.data.USERNAME | writeToFile "/vault/secrets/user" "vault" "vault" "0600" }}
          {{ .Data.data.PASSWORD | writeToFile "/vault/secrets/pass" "vault" "vault" "0600" }}
          {{- end -}}
    spec:
      containers:
      - name: transmission
        image: lscr.io/linuxserver/transmission:latest
        ports:
        - containerPort: 9091
          protocol: TCP
        - containerPort: 51413
          protocol: TCP
        - containerPort: 51413
          protocol: UDP
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        env:
        - name: FILE__USER
          value: /vault/secrets/user
        - name: FILE__PASS
          value: /vault/secrets/pass
        - name: HOST_WHITELIST
          value: "0.0.0.0,192.168.1.0/24,127.0.0.1"
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /config
        - name: transmission-config
          mountPath: /config/settings.json
          subPath: settings.json
        - name: downloads
          mountPath: /downloads
        - name: hooks
          mountPath: /scripts
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: catuai
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      volumes:
      - name: config
        hostPath:
          path: /mnt/transmission
          type: DirectoryOrCreate
      - name: transmission-config
        configMap:
          name: transmission-config
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
      - name: hooks
        configMap:
          name: transmission-hooks
          defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
spec:
  selector:
    app: transmission
  ports:
  - name: webui
    port: 9091
    targetPort: 9091
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: transmission-lb
  annotations:
    external-dns.alpha.kubernetes.io/hostname: transmission.lan
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.36
  ports:
  - name: webui
    port: 80
    targetPort: 9091
    protocol: TCP
  - name: tcp
    port: 51413
    targetPort: 51413
    protocol: TCP
  - name: udp
    port: 51413
    targetPort: 51413
    protocol: UDP
  selector:
    app: transmission