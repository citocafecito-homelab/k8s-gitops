apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-red
  labels:
    tier: disposable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-red
  template:
    metadata:
      labels:
        app: node-red
    spec:
      hostNetwork: false
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: node-red
        image: nodered/node-red:latest
        ports:
        - containerPort: 1880
          name: api
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /data
          name: node-red-data
        - mountPath: /tmp
          name: tmp-env
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "256Mi"
      volumes:
      - name: node-red-data
        emptyDir: {}
      - name: tmp-env
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: node-red
  namespace: automation
spec:
  selector:
    app: node-red
  ports:
    - protocol: TCP
      port: 1880
      targetPort: 1880
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-red
spec:
  # ingressClassName: cloudflare-tunnel
  rules:
  - host: workflows.lan
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: node-red
              port:
                number: 1880