apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-headless
spec:
  clusterIP: None
  selector:
    app: qbittorrent
  ports:
  - name: webui
    port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qbittorrent
spec:
  serviceName: "qbittorrent-headless"
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      # VPN Sidecar
      - name: gluetun
        image: qmcgaw/gluetun:latest
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        env:
        # Permitir entrada al puerto de la WebUI y subredes locales
        - name: FIREWALL_INPUT_PORTS
          value: "8080"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "192.168.1.0/24,10.244.0.0/16,10.96.0.0/12"

        # Autenticación PIA desde Secrets
        - name: OPENVPN_USER
          valueFrom:
            secretKeyRef:
              name: pia-credentials
              key: VPN_SERVICE_USER
        - name: OPENVPN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pia-credentials
              key: VPN_SERVICE_PASSWORD

        # Configuración PIA y Port Forwarding
        - name: VPN_SERVICE_PROVIDER
          value: "private internet access"
        - name: VPN_TYPE
          value: "openvpn"
        - name: OPENVPN_PROTOCOL
          value: "udp"
        - name: PRIVATE_INTERNET_ACCESS_OPENVPN_ENCRYPTION_PRESET
          value: "normal"
        - name: PORT_FORWARD_ONLY
          value: "true"
        - name: VPN_PORT_FORWARDING
          value: "on"
        - name: VPN_PORT_FORWARDING_STATUS_FILE
          value: "/tmp/gluetun/forwarded_port"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: gluetun-data
          mountPath: /tmp/gluetun
        - name: tun
          mountPath: /dev/net/tun

      # Port Sync Sidecar (PIA Port -> qBittorrent API)
      - name: port-forward-sync
        image: curlimages/curl:latest
        command:
          - /bin/sh
          - -c
          - |
            echo "Iniciando monitor de puerto PIA..."
            OLD_PORT=""
            while true; do
              if [ -f /tmp/gluetun/forwarded_port ]; then
                PORT=$(cat /tmp/gluetun/forwarded_port)
                if [ -n "$PORT" ] && [ "$PORT" != "$OLD_PORT" ]; then
                  echo "Nuevo puerto detectado en PIA: $PORT. Actualizando qBittorrent..."
                  curl -s -X POST "http://localhost:8080/api/v2/app/setPreferences" \
                    --data-urlencode 'json={"listen_port": '$PORT'}'
                  OLD_PORT=$PORT
                fi
              fi
              sleep 60
            done
        volumeMounts:
        - name: gluetun-data
          mountPath: /tmp/gluetun

      # Torrent Downloader
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        env:
        - name: WEBUI_PORT
          value: "8080"
        - name: TORRENTING_PORT
          value: "6881"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /config/qBittorrent
        - name: downloads
          mountPath: /downloads
        - name: latteam
          mountPath: /LatTeam

      nodeSelector:
        kubernetes.io/hostname: catimore
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
      - name: gluetun-data
        emptyDir: {}
      - name: config
        hostPath:
          path: /mnt/qbittorrent
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
      - name: latteam
        hostPath:
          path: /media/multimedia/LatTeam
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-web
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  annotations:
    external-dns.alpha.kubernetes.io/hostname: qbittorrent.lan
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.35
  selector:
    app: qbittorrent
  ports:
  - name: default
    port: 80
    targetPort: 8080
  - name: webui
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: qbittorrent.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: qbittorrent-web
              port:
                number: 8080