apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkstack
  labels:
    app: linkstack
    app.kubernetes.io/name: linkstack
    app.kubernetes.io/part-of: linkstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkstack
      app.kubernetes.io/name: linkstack
  template:
    metadata:
      labels:
        app: linkstack
        app.kubernetes.io/name: linkstack
        app.kubernetes.io/part-of: linkstack
      annotations:
        app.kubernetes.io/documentation: "https://github.com/LinkStackOrg/LinkStack"
        linkstack.io/docker: "https://github.com/LinkStackOrg/linkstack-docker"
        linkstack.io/variables: "https://github.com/LinkStackOrg/LinkStack/blob/main/.env.example"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: vault
        vault.hashicorp.com/agent-inject-secret-secrets: "secret/data/linkstack"
        vault.hashicorp.com/agent-inject-template-secrets: |
          {{- with secret "secret/data/linkstack" -}}
          AWS_ACCESS_KEY_ID="{{ .Data.data.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY="{{ .Data.data.AWS_SECRET_ACCESS_KEY }}"
          {{- end -}}
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      initContainers:
      - name: validate-mysql-connection
        image: mysql:9
        command:
          - sh
          - -c
          - |
            echo "Intentando conectar a MySQL en ${MYSQL_HOST}..."
            until mysqladmin ping -h "${MYSQL_HOST}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent; do
              echo "Esperando a que MySQL esté disponible..."
              sleep 2
            done
            echo "Conexión a MySQL establecida exitosamente."
        envFrom:
        - configMapRef:
            name: linkstack-database
      containers:
      - name: linkstack
        image: docker.io/linkstackorg/linkstack:latest
        command:
          - sh
          - -c
          - |
            . /vault/secrets/secrets
            exec docker-entrypoint.sh
        env:
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: linkstack-database
              key: MYSQL_DATABASE
        - name: DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: linkstack-database
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: linkstack-database
              key: MYSQL_PASSWORD
        envFrom:
        - configMapRef:
            name: linkstack-config
        ports:
        - name: https
          containerPort: 443
        resources:
          requests:
            cpu: 40m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi
        securityContext:
          runAsUser: 100
          runAsGroup: 101
          allowPrivilegeEscalation: true
          capabilities:
            add:
              - NET_BIND_SERVICE
        volumeMounts:
        - name: linkstack-data
          mountPath: /htdocs/assets/img
          subPath: img
        # - name: linkstack-data
        #   mountPath: /htdocs/themes
        #   subPath: themes
      securityContext:
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      volumes:
      - name: linkstack-data
        persistentVolumeClaim:
          claimName: linkstack-pvc