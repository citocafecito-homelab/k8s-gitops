apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: qbittorrent-jobs
  files:
  - config/vault.hcl
  - config/migrate.hcl
  
- name: vault-scripts
  files:
  - scripts/jwt-setup.sh
  - scripts/vault-entrypoint.sh
  
resources:
- deployment.yaml
- svc.yaml
- initializer.yaml
- ingress.yaml