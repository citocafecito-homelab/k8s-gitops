      #   volumeMounts:
      #   - name: config
      #     mountPath: /config
      containers:
      - name: transmission
        image: lscr.io/linuxserver/transmission:latest
        env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: "FILE__USER"
            value: "/vault/secrets/user"
          - name: "FILE__PASS"
            value: "/vault/secrets/password"
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        livenessProbe:
          exec:
            command: ["/bin/bash", "/scripts/check-port-status.sh"]
          initialDelaySeconds: 60
          periodSeconds: 60
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 1Gi
        volumeMounts:
        - name: scripts
          mountPath: /custom-cont-init.d/01-setup-config.sh
          subPath: 01-setup-config.sh
        - name: scripts
          mountPath: /scripts
        - name: config
          mountPath: /config
        - name: watch
          mountPath: /watch
        - name: downloads
          mountPath: /downloads
      - name: tagger
        image: lscr.io/linuxserver/transmission:latest
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "[SIDECAR] Esperando inicialización..."
            # Aseguramos que el archivo exista antes de empezar
            touch /config/pending_tags.txt
            # Ejecutamos tu script robusto
            /scripts/tagger-daemon.sh
        env:
          - name: "FILE__USER"
            value: "/vault/secrets/user"
          - name: "FILE__PASS"
            value: "/vault/secrets/password"
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: config
          mountPath: /config
      - name: vpn
        image: qmcgaw/gluetun:latest
        ports:
        - containerPort: 8000
          name: api
          protocol: TCP
        - containerPort: 9091
          name: webui
          protocol: TCP
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        env:
        - name: FIREWALL_INPUT_PORTS
          value: "9091"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "192.168.1.0/24,10.244.0.0/16,10.96.0.0/12"
        
        # --- Open VPN
        - name: OPENVPN_USER_SECRETFILE
          value: "/vault/secrets/vpn_user"
        - name: OPENVPN_PASSWORD_SECRETFILE
          value: "/vault/secrets/vpn_pass"
        - name: OPENVPN_PROTOCOL
          value: "udp"
        
        # --- PIA
        - name: PRIVATE_INTERNET_ACCESS_OPENVPN_ENCRYPTION_PRESET
          value: "normal"
        
        # --- Gluetun Configuration
        - name: VPN_TYPE
          value: "openvpn"
        - name: PORT_FORWARD_ONLY
          value: "true"
        - name: VPN_PORT_FORWARDING
          value: "on"
        - name: VPN_PORT_FORWARDING_STATUS_FILE
          value: "/config/pia_port.txt"
        - name: VPN_SERVICE_PROVIDER
          value: "private internet access"
        volumeMounts:
        - name: tun
          mountPath: /dev/net/tun
        - name: config
          mountPath: /config
      nodeSelector:
        kubernetes.io/hostname: catuai
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
      - name: scripts
        configMap:
          name: transmission-scripts
          defaultMode: 0755
      - name: config
        hostPath:
          path: /mnt/transmission
      - name: watch
        hostPath:
          path: /mnt/transmission/watch
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc