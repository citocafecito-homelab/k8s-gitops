apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixpost
  labels:
    app: mixpost
    app.kubernetes.io/name: mixpost
    app.kubernetes.io/part-of: mixpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mixpost
      app.kubernetes.io/name: mixpost
  template:
    metadata:
      labels:
        app: mixpost
        app.kubernetes.io/name: mixpost
        app.kubernetes.io/part-of: mixpost
      annotations:
        app.kubernetes.io/documentation: "https://github.com/inovector/mixpost"
        mixpost.io/docker: "https://docs.mixpost.app/lite/installation/docker"
        mixpost.io/variables: "https://docs.mixpost.app/lite/configuration/environment-variables"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: vault
        vault.hashicorp.com/agent-inject-secret-secrets: "secret/data/mixpost"
        vault.hashicorp.com/agent-inject-template-secrets: |
          {{- with secret "secret/data/mixpost" -}}
          AWS_ACCESS_KEY_ID="{{ .Data.data.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY="{{ .Data.data.AWS_SECRET_ACCESS_KEY }}"
          APP_KEY="{{ .Data.data.APP_KEY }}"
          {{- end -}}
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      containers:
      - name: mixpost
        image: inovector/mixpost:latest
        command:
        - sh
        - -c
        - |
            set -a
            . /vault/secrets/secrets
            set +a
            exec start.sh
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: mixpost-database
              key: MYSQL_HOST
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: mixpost-database
              key: MYSQL_DATABASE
        - name: DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: mixpost-database
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: mixpost-database
              key: MYSQL_PASSWORD
        envFrom:
        - configMapRef:
            name: mixpost-config
        ports:
        - name: https
          containerPort: 443
        resources:
          requests:
            cpu: 40m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 512Mi
        securityContext:
        #   runAsUser: 100
        #   runAsGroup: 101
        #   allowPrivilegeEscalation: true
          capabilities:
            add:
            - NET_BIND_SERVICE
        # volumeMounts:
        # - name: mixpost-data
        #   mountPath: /htdocs/assets/img
        #   subPath: img
      securityContext:
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      # volumes:
      # - name: mixpost-data
      #   persistentVolumeClaim:
      #     claimName: mixpost-pvc