apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: streaming

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: transmission-scripts
  files:
  - scripts/01-setup-config.sh
  - scripts/added.sh
  - scripts/tagger-daemon.sh

resources:
- deployment.yaml
- svc.yaml
- ingress.yaml