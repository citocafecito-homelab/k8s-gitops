apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: kite-

components:
  - ../../../components/postgresql

generatorOptions:
  disableNameSuffixHash: true
  
secretGenerator:
  - name: templates
    files:
      - templates/config.yml.tpl

labels:
  - pairs:
      app.kubernetes.io/part-of: kite
    includeSelectors: false

resources:
- sa.yaml
- rbac.yaml
- config.yaml

# Postgresql
# - database-pv.yaml
# - database-deployment.yaml
# - database-svc.yaml

# Kite
- server-deployment.yaml
- server-svc.yaml
- server-ingress.yaml

patches:
  - target:
      kind: PersistentVolume
      name: postgresql-pv
    patch: |-
      - op: replace
        path: /spec/hostPath/path
        value: /mnt/kite-postgresql

  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: postgresql
    patch: |-
      - op: replace
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-secret-database
        value: "secret/data/kite"
      - op: replace
        path: /spec/template/metadata/annotations/vault.hashicorp.com~1agent-inject-template-database
        value: |-
          {{- with secret "secret/data/kite" -}}
          {{ .Data.data.DATABASE_NAME | writeToFile "/vault/secrets/database" "vault" "vault" "0644" }}
          {{ .Data.data.DATABASE_USERNAME | writeToFile "/vault/secrets/username" "vault" "vault" "0644" }}
          {{ .Data.data.DATABASE_PASSWORD | writeToFile "/vault/secrets/password" "vault" "vault" "0644" }}
          {{- end -}}