apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app: server
    app.kubernetes.io/name: server
    database-validated: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
      app.kubernetes.io/name: server
  template:
    metadata:
      labels:
        app: server
        app.kubernetes.io/name: server
      annotations:
        app.kubernetes.io/documentation: "https://github.com/LinkStackOrg/LinkStack"
        linkstack.io/docker: "https://github.com/LinkStackOrg/linkstack-docker"
        linkstack.io/variables: "https://github.com/LinkStackOrg/LinkStack/blob/main/.env.example"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: vault
        vault.hashicorp.com/agent-inject-secret-secrets: "secret/data/linkstack"
        vault.hashicorp.com/agent-inject-template-secrets: |
          {{- with secret "secret/data/linkstack" -}}
          AWS_ACCESS_KEY_ID="{{ .Data.data.AWS_ACCESS_KEY_ID }}"
          AWS_SECRET_ACCESS_KEY="{{ .Data.data.AWS_SECRET_ACCESS_KEY }}"

          # DB_DATABASE="{{ .Data.data.DB_DATABASE }}"
          # DB_USERNAME="{{ .Data.data.DB_USERNAME }}"
          # DB_PASSWORD="{{ .Data.data.DB_PASSWORD }}"
          {{- end -}}
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      containers:
      - name: linkstack
        image: docker.io/linkstackorg/linkstack:latest
        command:
          - sh
          - -c
          - |
            . /vault/secrets/secrets
            exec docker-entrypoint.sh
        env:
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: linkstack-database
              key: MYSQL_DATABASE
        - name: DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: linkstack-database
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: linkstack-database
              key: MYSQL_PASSWORD
        envFrom:
        - configMapRef:
            name: linkstack-config
        ports:
        - name: https
          containerPort: 443
        resources:
          requests:
            cpu: 40m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        securityContext:
          runAsUser: 100
          runAsGroup: 101
          allowPrivilegeEscalation: true
          capabilities:
            add:
              - NET_BIND_SERVICE
        volumeMounts:
        - name: linkstack-data
          mountPath: /htdocs/assets/img
          subPath: img
      securityContext:
        sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      volumes:
      - name: linkstack-data
        persistentVolumeClaim:
          claimName: linkstack-pvc