apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: streaming

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: qbittorrent-scripts
  files:
  # Init
  - scripts/01-setup-config.sh

  # Torrent Hooks
  - scripts/torrent-added.sh
  - scripts/torrent-finished.sh

  # Pod Lifecycle
  - scripts/pod-pre-stop.sh

  # Pia VPN
  - scripts/update-port.sh

resources:
# - cronjobs/check-port.yaml
- statefulset.yaml
- svc.yaml
- ingress.yaml