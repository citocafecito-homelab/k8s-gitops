apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: amd-gpu-nodes
  namespace: kube-system
spec:
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: amd.com/gpu.family
                    operator: Exists