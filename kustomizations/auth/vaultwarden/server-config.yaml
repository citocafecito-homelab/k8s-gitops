apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-config
data:
  DOMAIN: "https://passwords.citocafecito.work"
  INVITATION_ORG_NAME: "CitoCafeCito"
  DATABASE_TYPE: POSTGRESQL
  PUSH_ENABLED: "true"
  SIGNUPS_ALLOWED: ""
  SIGNUPS_VERIFY: ""
  INVITATIONS_ALLOWED: "true"
  IP_HEADER: "CF-Connecting-IP"
  SMTP_FROM: "vaultwarden@citocafecito.work"
  SMTP_FROM_NAME: "Citocafecito Vaultwarden"
  SMTP_TIMEOUT: "15"