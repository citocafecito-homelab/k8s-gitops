apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vaultwarden-postgresql
spec:
  serviceName: vaultwarden-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: vaultwarden-postgresql
      app.kubernetes.io/name: vaultwarden-postgresql
      app.kubernetes.io/part-of: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden-postgresql
        app.kubernetes.io/name: vaultwarden-postgresql
        app.kubernetes.io/part-of: vaultwarden
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault"
        vault.hashicorp.com/agent-inject-secret-vaultwarden: "secret/data/vaultwarden"
        vault.hashicorp.com/agent-inject-template-vaultwarden: |
          {{- with secret "secret/data/vaultwarden" -}}
          {{ .Data.data.DATABASE_NAME | writeToFile "/vault/secrets/database" "vault" "vault" "0644" }}
          {{ .Data.data.DATABASE_USERNAME | writeToFile "/vault/secrets/username" "vault" "vault" "0644" }}
          {{ .Data.data.DATABASE_PASSWORD | writeToFile "/vault/secrets/password" "vault" "vault" "0644" }}
          {{- end -}}
    spec:
      enableServiceLinks: false
      serviceAccountName: vaultwarden
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - containerPort: 5432
        env:
        - name: TZ
          value: "America/Bogota"
        - name: PGSOCKET_DIR
          value: /tmp
        - name: POSTGRES_DB_FILE
          value: /vault/secrets/database
        - name: POSTGRES_USER_FILE
          value: /vault/secrets/username
        - name: POSTGRES_PASSWORD_FILE
          value: /vault/secrets/password
        livenessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $(cat /vault/secrets/username)"]
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command: ["sh", "-c", "pg_isready -U $(cat /vault/secrets/username)"]
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: storage
          mountPath: /var/lib/postgresql
      nodeSelector:
        kubernetes.io/hostname: catuai
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: vaultwarden-postgresql-pvc
