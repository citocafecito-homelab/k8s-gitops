apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwa-api
  namespace: media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwa-api
  template:
    metadata:
      labels:
        app: openwa-api
    spec:
      automountServiceAccountToken: false
      containers:
      - name: openwa
        image: ghcr.io/rmyndharis/openwa:latest
        env:
        # Server
        - name: PORT
          value: "2785"
        - name: NODE_ENV
          value: "development"
        - name: AUTO_START_SESSIONS
          value: "false"

        # Database (SQLite)
        - name: DATABASE_TYPE
          value: "sqlite"
        - name: DATABASE_CONNECTION_CLIENT
          value: "sqlite3"
        - name: DATABASE_CONNECTION_FILENAME
          value: "/data/openwa.sqlite"
        - name: DATABASE_SYNCHRONIZE
          value: "true"
        - name: DATABASE_LOGGING
          value: "false"

        # WhatsApp Engine & Puppeteer
        - name: ENGINE_TYPE
          value: "whatsapp-web.js"
        - name: PLUGINS_ENABLED
          value: "false"
        - name: PUPPETEER_HEADLESS
          value: "true"
        - name: PUPPETEER_ARGS
          value: "--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage"

        # Webhook
        - name: WEBHOOK_TIMEOUT
          value: "10000"
        - name: WEBHOOK_MAX_RETRIES
          value: "3"
        - name: WEBHOOK_RETRY_DELAY
          value: "5000"

        # Storage (Local filesystem)
        - name: STORAGE_TYPE
          value: "local"
        # - name: STORAGE_LOCAL_PATH
        #   value: "/data/media"

        # Redis & Queue (Disabled)
        - name: REDIS_ENABLED
          value: "false"
        - name: REDIS_BUILTIN
          value: "false"
        - name: QUEUE_ENABLED
          value: "false"
        - name: CACHE_ENABLED
          value: "false"

        # Built-in Docker services (Disabled)
        - name: POSTGRES_BUILTIN
          value: "false"
        - name: MINIO_BUILTIN
          value: "false"
        
        # API Security
        - name: AUTH_GLOBAL_KEY
          value: "test"
        ports:
        - containerPort: 2785
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          runAsNonRoot: false
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: true
          capabilities:
            drop:
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - FOWNER
            - SETUID
            - SETGID
        resources:
          limits:
            cpu: "1"
            memory: 1.5Gi
          requests:
            cpu: 500m
            memory: 768Mi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: openwa-session
          mountPath: /app/data
        - name: openwa-tmp
          mountPath: /tmp
      nodeSelector:
        kubernetes.io/hostname: castillo
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
      - name: openwa-tmp
        emptyDir:
          medium: Memory
      - name: openwa-session
        hostPath:
          path: /mnt/openwa
---
apiVersion: v1
kind: Service
metadata:
  name: openwa
  namespace: media
spec:
  ports:
    - port: 2785
      targetPort: 2785
      protocol: TCP
  selector:
    app: openwa-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwa
  namespace: media
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  ingressClassName: "traefik"
  rules:
    - host: openwa.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openwa
                port:
                  number: 2785