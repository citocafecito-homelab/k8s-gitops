apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app: vault
        app.kubernetes.io/name: vault
    spec:
      serviceAccountName: vault
      containers:
      - name: vault
        image: hashicorp/vault:latest
        command: [ "/bin/sh", "-c", "/vault/scripts/vault-entrypoint.sh" ]
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "/vault/scripts/jwt-setup.sh"]
        env:
        - name: SKIP_CHOWN
          value: "true"
        - name: VAULT_ADDR
          value: http://127.0.0.1:8200
        envFrom:
        - secretRef:
            name: vault-bootstrap
        - secretRef:
            name: vault-garage-creds
        ports:
        - containerPort: 8200
        securityContext:
          capabilities:
            add: [ "IPC_LOCK" ]
        livenessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8200
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /v1/sys/health
            port: 8200
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /vault/config
          readOnly: true
        - name: vault-scripts
          mountPath: /vault/scripts
        resources:
          requests:
            memory: 32Mi
            cpu: 50m
          limits:
            memory: 128Mi
            cpu: 200m
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      volumes:
      - name: config
        configMap:
          name: vault-config
      - name: vault-scripts
        configMap:
          name: vault-scripts
          defaultMode: 493
