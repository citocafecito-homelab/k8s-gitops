apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkwarden
  labels:
    app: linkwarden
    app.kubernetes.io/name: linkwarden
    app.kubernetes.io/part-of: linkwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkwarden
      app.kubernetes.io/name: linkwarden
  template:
    metadata:
      labels:
        app: linkwarden
        app.kubernetes.io/name: linkwarden
        app.kubernetes.io/part-of: linkwarden
      annotations:
        app.kubernetes.io/documentation: "https://github.com/linkwarden/linkwarden"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault"
        vault.hashicorp.com/agent-inject-secret-credentials: "secret/data/linkwarden"
        vault.hashicorp.com/agent-inject-template-environment.env: |
          {{- with secret "secret/data/buzzkit" -}}
          SPACES_KEY="{{ .Data.data.S3_ACCESS_KEY_ID }}"
          SPACES_SECRET="{{ .Data.data.S3_SECRET_ACCESS_KEY }}"
          {{- end -}}
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      serviceAccountName: linkwarden
      initContainers:
      - name: prisma-migrate
        image: ghcr.io/linkwarden/linkwarden:latest
        command: ["prisma", "migrate", "deploy", "--schema=/data/packages/prisma/schema.prisma"]
        envFrom:
        - configMapRef:
            name: linkwarden-config
      containers:
      - name: linkwarden
        image: ghcr.io/linkwarden/linkwarden:latest
        command:
        - "sh"
        - "-c"
        - "cd /data/apps/worker && exec tsx worker.ts"
        env:
        - name: DOTENV_PATH
          value: "/vault/secrets/environment.env"
        envFrom:
        - configMapRef:
            name: linkwarden-config
        - configMapRef:
            name: linkwarden-web
        ports:
        - name: https
          containerPort: 443
        resources:
          requests:
            cpu: 40m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 2000
        runAsNonRoot: true
      nodeSelector:
        kubernetes.io/hostname: catimore
      volumes:
      - name: linkwarden-data
        persistentVolumeClaim:
          claimName: linkwarden-pvc