apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  labels:
    vpn-enabled: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/part-of: streaming-stack
        app.kubernetes.io/volume-downloads: attached
    spec:
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        envFrom:
          - configMapRef:
              name: streaming-stack-config
        env:
          - name: WEBUI_PORT
            value: "8080"
          - name: TORRENTING_PORT
            value: "6881"
        lifecycle:
          preStop:
            exec:
              command: ["/bin/bash", "/scripts/pod-pre-stop.sh"]
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 2
            memory: 2Gi
        volumeMounts:
          - name: config
            mountPath: /config/qBittorrent
          - name: scripts
            mountPath: /custom-cont-init.d/01-setup-config.sh
            subPath: 01-setup-config.sh
          - name: scripts
            mountPath: /scripts
          - name: radarr
            mountPath: /downloads/radarr
          - name: sonarr
            mountPath: /downloads/tv-sonarr
          - name: latteam
            mountPath: /LatTeam
      nodeSelector:
        kubernetes.io/hostname: catimore
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
        - name: config
          hostPath:
            path: /mnt/qbittorrent
            type: DirectoryOrCreate
        - name: scripts
          projected:
            defaultMode: 0755
            sources:
              - configMap:
                  name: qbittorrent-scripts
              - configMap:
                  name: shared-scripts
        - name: sonarr
          hostPath:
            path: /media/multimedia/series/sonarr
            type: DirectoryOrCreate
        - name: radarr
          hostPath:
            path: /media/multimedia/movies/radarr
            type: DirectoryOrCreate
        - name: latteam
          hostPath:
            path: /media/multimedia/movies/LatTeam
            type: DirectoryOrCreate