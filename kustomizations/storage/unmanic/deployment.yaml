  # https://docs.unmanic.app/docs/installation/kubernetes 
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: unmanic
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: unmanic
    template:
      metadata:
        labels:
          app: unmanic
      spec:
        containers:
        - name: unmanic
          image: josh5/unmanic:latest
          imagePullPolicy: IfNotPresent
          env:
          - name: PUID
            value: "1000"
          - name: PGID
            value: "1000"
          - name: TZ
            value: America/Bogota
          - name: HOME
            value: "/config"
          ports:
          - containerPort: 8888
            name: webui
            protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256M
            limits:
              cpu: 4
              memory: 8G
          livenessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: webui
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
          - name: dri
            mountPath: /dev/dri
            readOnly: false
          - name: config
            mountPath: /config
          - name: cache
            mountPath: /tmp/unmanic
          - name: animations
            mountPath: /media/animations
          - name: multimedia
            mountPath: /media/multimedia
          - name: multimedia2
            mountPath: /media/multimedia2
        nodeSelector:
          kubernetes.io/hostname: castillo
        securityContext:
          supplementalGroups: [44, 107, 992]
        volumes:
        - name: dri
          hostPath:
            path: /dev/dri
        - name: config
          hostPath:
            path: /mnt/unmanic
        - name: cache
          emptyDir: {}
        - name: animations
          hostPath:
            path: /mnt/animations
        - name: multimedia
          hostPath:
            path: /mnt/multimedia
        - name: multimedia2
          hostPath:
            path: /mnt/multimedia2
