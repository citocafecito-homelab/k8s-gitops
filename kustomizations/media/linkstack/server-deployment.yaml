apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkstack
  labels:
    app: linkstack
    app.kubernetes.io/name: linkstack
    app.kubernetes.io/part-of: linkstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkstack
      app.kubernetes.io/name: linkstack
  template:
    metadata:
      labels:
        app: linkstack
        app.kubernetes.io/name: linkstack
        app.kubernetes.io/part-of: linkstack
    spec:
      containers:
      - name: linkstack
        image: ghcr.io/linkstackorg/linkstack:latest
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 443
        envFrom:
        - configMapRef:
            name: linkstack-config
        resources:
          requests:
            cpu: 40m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi 
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /
            port: 80
          failureThreshold: 30
          periodSeconds: 10