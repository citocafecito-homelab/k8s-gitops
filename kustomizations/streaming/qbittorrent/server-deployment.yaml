apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qbittorrent
spec:
  serviceName: "qbittorrent-headless"
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      # VPN Sidecar
      - name: gluetun
        image: qmcgaw/gluetun:latest
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        env:
        # Permitir entrada al puerto de la WebUI y subredes locales
        - name: FIREWALL_INPUT_PORTS
          value: "8080"
        - name: FIREWALL_OUTBOUND_SUBNETS
          value: "192.168.1.0/24,10.244.0.0/16,10.96.0.0/12"

        # Autenticación PIA desde Secrets
        - name: OPENVPN_USER
          valueFrom:
            secretKeyRef:
              name: pia-credentials
              key: VPN_SERVICE_USER
        - name: OPENVPN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pia-credentials
              key: VPN_SERVICE_PASSWORD

        # Configuración PIA y Port Forwarding
        - name: VPN_SERVICE_PROVIDER
          value: "private internet access"
        - name: VPN_TYPE
          value: "openvpn"
        - name: OPENVPN_PROTOCOL
          value: "udp"
        - name: PRIVATE_INTERNET_ACCESS_OPENVPN_ENCRYPTION_PRESET
          value: "normal"
        - name: PORT_FORWARD_ONLY
          value: "true"
        - name: VPN_PORT_FORWARDING
          value: "on"
        - name: VPN_PORT_FORWARDING_STATUS_FILE
          value: "/config/qBittorrent/gluetun/forwarded_port"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: config
          mountPath: /config/qBittorrent
        - name: tun
          mountPath: /dev/net/tun

      # Torrent Downloader
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        env:
        - name: WEBUI_PORT
          value: "8080"
        - name: TORRENTING_PORT
          value: "6881"
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: qbittorrent
              key: token
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "sleep 10 && /scripts/check-port-daemon.sh &"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /config/qBittorrent
        - name: scripts
          mountPath: /custom-cont-init.d/01-setup-config.sh
          subPath: 01-setup-config.sh
        - name: scripts
          mountPath: /scripts
        - name: downloads
          mountPath: /downloads
        - name: latteam
          mountPath: /LatTeam

      nodeSelector:
        kubernetes.io/hostname: catimore
      volumes:
      - name: tun
        hostPath:
          path: /dev/net/tun
      - name: script-volume
        configMap:
          name: qbittorrent-port-updater
          defaultMode: 0755
      - name: config
        hostPath:
          path: /mnt/qbittorrent
          type: DirectoryOrCreate
      - name: scripts
        configMap:
          name: qbittorrent-scripts
          defaultMode: 0755
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
      - name: latteam
        hostPath:
          path: /media/multimedia/LatTeam
          type: DirectoryOrCreate