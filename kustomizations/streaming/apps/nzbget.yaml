apiVersion: apps/v1
kind: Deployment
metadata:
  name: nzbget
  labels:
    app: nzbget
    app.kubernetes.io/name: nzbget
    app.kubernetes.io/instance: streaming-stack
    app.kubernetes.io/part-of: streaming-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nzbget
      app.kubernetes.io/name: nzbget
      app.kubernetes.io/instance: streaming-stack
      app.kubernetes.io/part-of: streaming-stack
  template:
    metadata:
      labels:
        app: nzbget
        app.kubernetes.io/name: nzbget
        app.kubernetes.io/instance: streaming-stack
        app.kubernetes.io/part-of: streaming-stack
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault"
        vault.hashicorp.com/agent-inject-secret-secrets: "secret/data/nzbget"
        vault.hashicorp.com/agent-inject-template-secrets: |
          {{- with secret "secret/data/nzbget" -}}
          {{ .Data.data.USER | writeToFile "/vault/secrets/user" "vault" "vault" "0600" }}
          {{ .Data.data.PASS | writeToFile "/vault/secrets/pass" "vault" "vault" "0600" }}
          {{- end -}}
    spec:
      containers:
      - name: nzbget
        image: lscr.io/linuxserver/nzbget:latest
        env:
        - name: NZBGET_USER__MYVAR
          value: /vault/secrets/user
        - name: NZBGET_PASS__MYVAR
          value: /vault/secrets/pass
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        ports:
        - containerPort: 8112
          name: webui
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
      nodeSelector:
        kubernetes.io/hostname: catuai
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      volumes:
      - name: config
        hostPath:
          path: /mnt/nzbget
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nzbget
spec:
  ports:
    - port: 6789
      targetPort: 6789
      name: tcp
  selector:
    app: nzbget
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nzbget
spec:
  rules:
    - host: nzbget.citocafecito.work
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nzbget
                port:
                  number: 6789