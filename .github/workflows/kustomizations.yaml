name: Deploy Kustomizations

on:
  push:
    branches:
      - main
    paths:
      - "kustomizations/**"
      - ".github/workflows/kustomizations.yaml"

jobs:
  deploy:
    runs-on: [self-hosted, arc, k8s]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - uses: yokawasa/action-setup-kube-tools@v0.13.5
        with:
          setup-tools: |
            kubectl
            helm
            kustomize
          kubectl: '1.33.4'
          helm: '3.18.6'
          kustomize: '5.6.0'

      - name: Apply Kustomizations
        run: |
          kubectl  apply -k kustomizations

      - name: Notify
        if: always()
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message || 'Ejecución Manual' }}"
          AUTHOR="${{ github.event.head_commit.author.name || github.triggering_user }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if [ "${{ job.status }}" = "success" ]; then
            STATUS_TAGS="coffee,white_check_mark"
            STATUS_PRIORITY="default"
            RESULT_EMOJI="✅ SUCCESS"
          else
            STATUS_TAGS="coffee,x"
            STATUS_PRIORITY="high"
            RESULT_EMOJI="❌ FAILURE"
          fi

          REPORT_BODY=$(cat <<EOF
          Estatus: $RESULT_EMOJI
          Rama: ${{ github.ref_name }}
          Commit: $SHORT_SHA
          Autor: $AUTHOR
          
          Mensaje:
          $COMMIT_MSG
          EOF
          )

          # 4. Enviar a ntfy con un botón de acción dedicado para ver logs
          curl -H "Authorization: Bearer ${{ secrets.NTFY_TOKEN }}" \
               -H "Title: ${{ github.repository }}"" \
               -H "Tags: ${STATUS_TAGS}" \
               -H "Priority: ${STATUS_PRIORITY}" \
               -H "Actions: view, Ver ejecución en GitHub, ${RUN_URL}" \
               -d "$REPORT_BODY" \
               http://ntfy.core.svc.cluster.local/github-actions