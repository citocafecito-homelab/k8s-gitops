apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkwarden-worker
  labels:
    app: linkwarden-worker
    app.kubernetes.io/name: linkwarden-worker
    app.kubernetes.io/part-of: linkwarden-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkwarden-worker
      app.kubernetes.io/name: linkwarden-worker
  template:
    metadata:
      labels:
        app: linkwarden-worker
        app.kubernetes.io/name: linkwarden-worker
        app.kubernetes.io/part-of: linkwarden-worker
      annotations:
        app.kubernetes.io/documentation: "https://github.com/linkwarden/linkwarden"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault"
        vault.hashicorp.com/agent-inject-secret-credentials: "secret/data/linkwarden"
        vault.hashicorp.com/agent-inject-template-environment.env: |
          {{- with secret "secret/data/linkwarden" -}}
          NEXTAUTH_SECRET="{{ .Data.data.NEXTAUTH_SECRET }}"
          SPACES_KEY="{{ .Data.data.S3_ACCESS_KEY_ID }}"
          SPACES_SECRET="{{ .Data.data.S3_SECRET_ACCESS_KEY }}"
          DATABASE_URL="postgresql://{{ .Data.data.DATABASE_USERNAME }}:{{ .Data.data.DATABASE_PASSWORD }}@linkwarden-postgresql:5432/{{ .Data.data.DATABASE_NAME }}"
          {{- end -}}
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      serviceAccountName: linkwarden
      containers:
      - name: linkwarden-worker
        image: ghcr.io/linkwarden/linkwarden:latest
        workingDir: /data/apps/worker
        command:
        - node
        - --env-file=/vault/secrets/environment.env
        - /data/node_modules/.bin/tsx
        - worker.ts
        envFrom:
        - configMapRef:
            name: linkwarden-config
        ports:
        - name: https
          containerPort: 3000
        resources:
          requests:
            cpu: 40m
            memory: 128Mi
          limits:
            cpu: 1
            memory: 1Gi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true