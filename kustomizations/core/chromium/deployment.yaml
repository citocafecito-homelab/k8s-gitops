apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome
  labels:
    app: chrome
spec:
  selector:
    matchLabels:
      app: chrome
  template:
    metadata:
      labels:
        app: chrome
    spec:
      containers:
      - name: chrome
        image: ghcr.io/browserless/chromium:v2.18.0
        ports:
        - containerPort: 3000
        env:
        - name: PREBOOT_CHROME
          value: "true"
        - name: CONCURRENT
          value: "2"
        - name: TIMEOUT
          value: "10000"
        - name: CHROME_FLAGS
          value: "--disable-gpu --disable-dev-shm-usage --no-sandbox"
        resources:
          requests:
            cpu: "0.5"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1.5Gi"
        livenessProbe:
          httpGet:
            path: /pressure
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /pressure
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /pressure
            port: 3000
          failureThreshold: 30
          periodSeconds: 2
