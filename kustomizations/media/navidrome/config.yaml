apiVersion: v1
kind: ConfigMap
metadata:
  name: navidrome-config
data:
  # --- Configuración General y UI ---
  ND_DEFAULTLANGUAGE: "es"
  ND_DEFAULTTHEME: "Spotify-ish"
  ND_ENABLEGRAVATAR: "true"
  ND_UIWELCOMEMESSAGE: "Bienvenidos a HabiMusic - Música en alta definición"
  ND_PLUGINS_FOLDER: "/data/plugins"
  ND_ENABLESTARRATING: "true"

  # --- Audio y ReplayGain ---
  ND_ENABLEREPLAYGAIN: "true"
  ND_TRANSCODINGCACHESIZE: "10GB"

  # --- Biblioteca y Escaneo ---
  ND_AUTOIMPORTPLAYLISTS: "true"
  ND_LYRICSPRIORITY: "nd-lyrics,lrc,embedded"
  ND_PLAYLISTSPATH: "playlists"
  ND_PREFERSORTTAGS: "true"
  ND_SCANSCHEDULE: "1h"
  ND_SCANNER_PURGEMISSING: "always"

  # --- Transcodding ---
  ND_ENABLETRANSCODINGCONFIG: "true"

  # --- Almacenamiento y Backups ---
  ND_BACKUP_COUNT: "3"
  ND_BACKUP_PATH: "/data/backup"
  ND_BACKUP_SCHEDULE: "@every 24h"
  ND_IMAGECACHESIZE: "500MB"

  # --- Conectividad y Compartir ---
  ND_ENABLESHARING: "true"
  ND_LASTFM_LANGUAGE: "es"
  ND_SHAREURL: "https://music.citocafecito.work"

  # --- Métricas y Monitoreo ---
  ND_PROMETHEUS_ENABLED: "true"
  ND_PROMETHEUS_METRICSPATH: "/metrics"