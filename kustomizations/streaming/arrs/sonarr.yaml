apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
      app.kubernetes.io/name: sonarr
  template:
    metadata:
      labels:
        app: sonarr
        app.kubernetes.io/name: sonarr
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: sonarr
        image: linuxserver/sonarr:latest
        ports:
        - containerPort: 8989
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        volumeMounts:
        - name: sonarr-config
          mountPath: /config
        - name: series
          mountPath: /tv
        - name: movies
          mountPath: /movies
        - name: downloads
          mountPath: /downloads
        - name: animes
          mountPath: /animes
        - name: animations
          mountPath: /animations
        - name: cartoons
          mountPath: /cartoons
        resources:
          requests:
            memory: 64Mi
            cpu: 5m
        livenessProbe:
          tcpSocket:
            port: 8989
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          tcpSocket:
            port: 8989
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      nodeSelector:
        kubernetes.io/hostname: castillo
      volumes:
      - name: sonarr-config
        hostPath:
          path: /mnt/sonarr
          type: DirectoryOrCreate
      - name: series
        persistentVolumeClaim:
          claimName: series-pvc
      - name: movies
        persistentVolumeClaim:
          claimName: movies-pvc
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
      - name: animes
        hostPath:
          path: /mnt/multimedia/animes
          type: DirectoryOrCreate
      - name: animations
        hostPath:
          path: /mnt/animations/series
          type: DirectoryOrCreate
      - name: cartoons
        hostPath:
          path: /mnt/multimedia/cartoons
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
spec:
  selector:
    app: sonarr
  ports:
  - port: 8989
    targetPort: 8989
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: sonarr.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: sonarr
              port:
                number: 8989
