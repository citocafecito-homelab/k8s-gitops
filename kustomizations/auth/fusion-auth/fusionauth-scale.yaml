kind: HTTPScaledObject
apiVersion: http.keda.sh/v1alpha1
metadata:
  name: fusionauth
  annotations:
    httpscaledobject.keda.sh/skip-scaledobject-creation: "false"
spec:
  hosts:
  - fusionauth.local
  - fusionauth.lan
  - fusionauth.citocafecito.work
  - fusionauth-proxy
  scaleTargetRef:
    kind: Deployment
    name: fusionauth
    service: fusionauth
    port: 80
  replicas:
    min: 0
    max: 3
  scaledownPeriod: 60
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: 1
      window: 1m