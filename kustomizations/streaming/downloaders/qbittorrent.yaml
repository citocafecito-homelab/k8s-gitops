apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-headless
spec:
  clusterIP: None
  selector:
    app: qbittorrent
  ports:
  - name: webui
    port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qbittorrent
spec:
  serviceName: "qbittorrent-headless"
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 6881
          protocol: TCP
        - containerPort: 6881
          protocol: UDP
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        env:
        - name: WEBUI_PORT
          valueFrom:
            configMapKeyRef:
              name: streaming-stack-config
              key: QBITTORRENT_PORT
        - name: TORRENTING_PORT
          value: "6881"
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /config/qBittorrent
        - name: downloads
          mountPath: /downloads
        - name: latteam
          mountPath: /LatTeam
      nodeSelector:
        kubernetes.io/hostname: catimore
      volumes:
      - name: config
        hostPath:
          path: /mnt/qbittorrent
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
      - name: latteam
        hostPath:
          path: /media/multimedia/LatTeam
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-web
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  annotations:
    external-dns.alpha.kubernetes.io/hostname: qbittorrent.lan
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.35
  selector:
    app: qbittorrent
  ports:
  - name: default
    port: 80
    targetPort: 8080
  - name: webui
    port: 8080
    targetPort: 8080
  - name: bittorrent-tcp
    port: 6881
    targetPort: 6881
    protocol: TCP
  - name: bittorrent-udp
    port: 6881
    targetPort: 6881
    protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: qbittorrent.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: qbittorrent-web
              port:
                number: 8080