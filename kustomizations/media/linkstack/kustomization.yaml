apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: linkstack-

components:
  - ../../../components/valkey
  - ../../../components/mysql

configurations:
  - kustomizeconfig.yaml
  
configMapGenerator:
  - name: app-config
    literals:
      - APP_NAME=linkstack
    options:
      disableNameSuffixHash: true

labels:
  - pairs:
      app.kubernetes.io/part-of: linkstack
    includeSelectors: false
    includeTemplates: true

resources:
# Database (Postgresql)
# - database-pv.yaml
# - database-config.yaml
# - database-deployment.yaml
# - database-svc.yaml

# Cache (Valkey)
# - cache-deployment.yaml
# - cache-svc.yaml

# Server (LinkStack)
- server-config.yaml
- server-pvc.yaml
- server-deployment.yaml
- server-svc.yaml
- server-ingress.yaml

replacements:
  - source:
      kind: ConfigMap
      name: app-config
      fieldPath: data.APP_NAME
    targets:
      - select:
          group: apps
          version: v1
          kind: StatefulSet
          name: mysql
        fieldPaths:
          - spec.template.metadata.annotations.[vault.hashicorp.com/agent-inject-secret-database]
          - spec.template.metadata.annotations.[vault.hashicorp.com/agent-inject-template-database]
        options:
          delimiter: 'secret/data/'
          index: 1
