apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-global
data:
  # Default Configuration
  TZ: "America/Bogota"
  WEBPASSWORD_FILE: "/vault/secrets/admin_password"
  DNSMASQ_LISTENING: "all"
  FTLCONF_webserver_api_enabled: "true"
  FTLCONF_webserver_api_password: ""
  
  # FTL
  FTLCONF_misc_etc_dnsmasq_d: "true"
  FTLCONF_dns_revServers: "true,192.168.1.0/16,192.168.1.1"
  FTLCONF_dns_upstreams: "1.1.1.1;1.0.0.1;8.8.8.8;8.8.4.4"
  FTLCONF_dns_AAAA: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-primary
data:
  # --- Global Config ---
  FTLCONF_dns_listeningMode: "all"
  FTLCONF_dns_interface: "enp1s0"

  # --- DHCPv4 ---
  FTLCONF_dhcp_active: "true"
  FTLCONF_dhcp_start: "192.168.1.160"
  FTLCONF_dhcp_end: "192.168.1.253"
  FTLCONF_dhcp_router: "192.168.1.1"
  FTLCONF_dhcp_netmask: "255.255.255.0"
  FTLCONF_dhcp_leaseTime: "86400"
  FTLCONF_dhcp_rapidCommit: "true"

  # --- DHCPv6 & RA (Nativo FTL v6) ---
  FTLCONF_dhcp_ipv6: "true"
  FTLCONF_dhcp_start6: "fd00:192:168:1::2"
  FTLCONF_dhcp_end6: "fd00:192:168:1::ffff"
  FTLCONF_dhcp_router6: "fe80::6a1d:efff:fe4a:3da6"
  FTLCONF_LOCAL_IPV6: "fe80::6a1d:efff:fe4a:3da6"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-custom-dns
  namespace: networking
data:
  custom.conf: |
    # Rango IPv6 + RA (SLAAC + DHCPv6)
    # Nota: dnsmasq/FTL incluye automáticamente la opción DNSv6 (23) hacia este host.
    dhcp-range=::2,::ffff,constructor:enp1s0,ra-names,slaac,64,86400s

    # Prioridad de RA en la interfaz
    ra-param=enp1s0,high,10,600

    quiet-dhcp6

    # Evita la inspección de interfaces VRF no utilizadas
    bind-interfaces

    # Network
    address=/router.lan/192.168.1.1
    address=/deco.lan/192.168.1.3
    address=/deco-aux.lan/192.168.1.4
    address=/deco-x20.lan/192.168.1.5

    # Computers
    address=/pneuma.lan/192.168.1.220
    address=/julie.lan/192.168.1.221

    # Printers
    address=/impresora.lan/192.168.1.225
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pihole-adlists
data:
  adlists.list: |
    https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
    # https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/adblock/pro.plus.txt
    https://raw.githubusercontent.com/stevejenkins/pi-hole-lists/refs/heads/main/blocklists.txt
    https://someonewhocares.org/hosts/zero/hosts
---


