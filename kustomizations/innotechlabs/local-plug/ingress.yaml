apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: localplug
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: localplug.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: localplug
              port:
                number: 3000