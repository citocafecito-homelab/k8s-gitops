apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-assistant-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  hostPath:
    path: /mnt/music-assistant
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-assistant-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: music-assistant
      app.kubernetes.io/name: music-assistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: music-assistant
        app.kubernetes.io/name: music-assistant
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: music-assistant
        image: ghcr.io/music-assistant/server:latest
        imagePullPolicy: Always
        env:
        - name: LOG_LEVEL
          value: info
        - name: TMPDIR
          value: /data/temp 
        - name: MASS_IP_ADDRESS
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: MASS_BASE_URL
          value: http://musicassistant.lan
        securityContext:
          privileged: true
          appArmorProfile:
            type: Unconfined
          capabilities:
            add:
            - DAC_READ_SEARCH 
            - SYS_ADMIN
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "6Gi"
        livenessProbe:
          httpGet:
            path: /
            port: 8095
            scheme: HTTP
          initialDelaySeconds: 45
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /
            port: 8095
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 15
        volumeMounts:
        - name: dri
          mountPath: /dev/dri
        - name: music-assistant-data
          mountPath: /data
      nodeSelector:
        kubernetes.io/hostname: castillo
      securityContext:
        fsGroup: 1000
        supplementalGroups: [44, 107, 992]
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: music-assistant-data
        persistentVolumeClaim:
          claimName: music-assistant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: music-assistant
spec:
  selector:
    app: music-assistant
  ports:
  - name: web
    protocol: TCP
    port: 8095
    targetPort: 8095
  - name: stream
    protocol: TCP
    port: 8097
    targetPort: 8097
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-assistant
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/transport.respondingtimeouts.readtimeout: "3600s"
    traefik.ingress.kubernetes.io/transport.respondingtimeouts.idletimeout: "3600s"
spec:
  rules:
  - host: musicassistant.lan
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: music-assistant
              port:
                number: 8095
