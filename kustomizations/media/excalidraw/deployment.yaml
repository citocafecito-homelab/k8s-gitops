apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidify
  labels:
    app: lidify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidify
  template:
    metadata:
      labels:
        app: lidify
    spec:
      containers:
        - name: lidify
          image: thewicklowwolf/lidify:latest
          ports:
            - containerPort: 5000
          env:
            - name: last_fm_api_key
              valueFrom:
                secretKeyRef:
                  name: navidrome-lastfm-secret
                  key: ND_LASTFM_APIKEY
            - name: last_fm_api_secret
              valueFrom:
                secretKeyRef:
                  name: navidrome-lastfm-secret
                  key: ND_LASTFM_SECRET
            - name: mode
              value: "LastFM"
          volumeMounts:
            - name: lidify-config
              mountPath: /lidify/config
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "128Mi"
      volumes:
        - name: lidify-config
          hostPath:
            path: /mnt/lidify
            type: DirectoryOrCreate
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File