apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: immich-

labels:
  - pairs:
      app.kubernetes.io/part-of: immich
    includeSelectors: false
    includeTemplates: true

components:
  - ../../../components/valkey

resources:
- sa.yaml
- config.yaml

# Database
- database-pv.yaml
- database-deployment.yaml
- database-svc.yaml 

# Server
- server-deployment.yaml
- server-svc.yaml
- server-ingress.yaml