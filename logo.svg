<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="transparent" />
  
  <text x="50%" y="45%" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="42" fill="#1A3A5A" stroke="#4DCCFF" stroke-width="2" filter="url(#neon-glow)" style="text-transform: uppercase; letter-spacing: 2px;">
    Aventuras Cósmicas
  </text>
  
  <text x="50%" y="85%" text-anchor="middle" font-family="sans-serif" font-weight="900" font-size="42" fill="#1A3A5A" stroke="#4DCCFF" stroke-width="2" filter="url(#neon-glow)" style="text-transform: uppercase; letter-spacing: 2px;">
    &amp; Conspiraciones
  </text>
</svg>