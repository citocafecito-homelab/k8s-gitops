apiVersion: apps/v1
kind: Deployment
metadata:
  name: wyoming-openai
  labels:
    app: wyoming-openai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wyoming-openai
  template:
    metadata:
      labels:
        app: wyoming-openai
    spec:
      containers:
      - name: wyoming-openai
        image: ghcr.io/roryeckel/wyoming_openai:latest
        ports:
        - containerPort: 10300
        env:
        - name: WYOMING_URI
          value: "tcp://0.0.0.0:10300"
        - name: WYOMING_LOG_LEVEL
          value: "INFO"
        - name: WYOMING_LANGUAGES
          value: "en"
        - name: TTS_OPENAI_URL
          value: "http://kokoro-fastapi:8880/v1"
        - name: TTS_MODELS
          value: "kokoro"
        - name: TTS_BACKEND
          value: "KOKORO_FASTAPI"