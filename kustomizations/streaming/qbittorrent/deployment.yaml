apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
        app.kubernetes.io/name: qbittorrent
        app.kubernetes.io/part-of: streaming-stack
        app.kubernetes.io/volume-downloads: attached
    spec:
      containers:
        # VPN Sidecar
        - name: gluetun
          image: qmcgaw/gluetun:latest
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: OPENVPN_USER
              valueFrom:
                secretKeyRef:
                  name: pia-credentials
                  key: VPN_SERVICE_USER
            - name: OPENVPN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pia-credentials
                  key: VPN_SERVICE_PASSWORD
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: qbittorrent
                  key: token
          envFrom:
            - configMapRef:
                name: vpn-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: scripts
              mountPath: /scripts
            - name: tun
              mountPath: /dev/net/tun

        # Torrent Downloader
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          envFrom:
            - configMapRef:
                name: streaming-stack-config
          env:
            - name: WEBUI_PORT
              value: "8080"
            - name: TORRENTING_PORT
              value: "6881"
          lifecycle:
            preStop:
              exec:
                command: ["/bin/bash", "/scripts/pod-pre-stop.sh"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config/qBittorrent
            - name: scripts
              mountPath: /custom-cont-init.d/01-setup-config.sh
              subPath: 01-setup-config.sh
            - name: scripts
              mountPath: /scripts
            - name: radarr
              mountPath: /downloads/radarr
            - name: sonarr
              mountPath: /downloads/tv-sonarr
            - name: latteam
              mountPath: /LatTeam
      nodeSelector:
        kubernetes.io/hostname: catimore
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
        - name: config
          hostPath:
            path: /mnt/qbittorrent
            type: DirectoryOrCreate
        - name: scripts
          projected:
            defaultMode: 0755
            sources:
              - configMap:
                  name: qbittorrent-scripts
              - configMap:
                  name: shared-scripts
        - name: sonarr
          hostPath:
            path: /media/multimedia/series/sonarr
            type: DirectoryOrCreate
        - name: radarr
          hostPath:
            path: /media/multimedia/movies/radarr
            type: DirectoryOrCreate
        - name: latteam
          hostPath:
            path: /media/multimedia/movies/LatTeam
            type: DirectoryOrCreate