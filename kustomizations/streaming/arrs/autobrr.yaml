# Check https://autobrr.com/installation/docker
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autobrr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autobrr
      app.kubernetes.io/name: autobrr
  template:
    metadata:
      labels:
        app: autobrr
        app.kubernetes.io/name: autobrr
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: autobrr
        image: ghcr.io/autobrr/autobrr:latest
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        ports:
        - containerPort: 7474
          protocol: TCP
        resources:
          requests:
            memory: 64Mi
            cpu: 5m
        securityContext:
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: config
          mountPath: /config
      nodeSelector:
        kubernetes.io/hostname: catuai
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      volumes:
      - name: config
        hostPath:
          path: /mnt/autobrr
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: autobrr
  labels:
    app: autobrr
    app.kubernetes.io/name: autobrr
    app.kubernetes.io/part-of: streaming-stack
spec:
  selector:
    app: autobrr
  ports:
  - name: http
    port: 7474
    targetPort: 7474
---
apiVersion: v1
kind: Service
metadata:
  name: autobrr-lb
  annotations:
    external-dns.alpha.kubernetes.io/hostname: autobrr.lan
  labels:
    type: LoadBalancer
spec:
  type: LoadBalancer
  selector:
    app: autobrr
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 7474
