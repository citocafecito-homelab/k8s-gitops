apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  labels:
    app: lidarr
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/instance: streaming-stack
    app.kubernetes.io/part-of: streaming-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
      app.kubernetes.io/name: lidarr
      app.kubernetes.io/instance: streaming-stack
  template:
    metadata:
      labels:
        app: lidarr
        app.kubernetes.io/name: lidarr
        app.kubernetes.io/instance: streaming-stack
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: lidarr
        image: lscr.io/linuxserver/lidarr:latest
        ports:
        - containerPort: 8686
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
        livenessProbe:
          httpGet:
            path: /
            port: 8686
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8686
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        - name: music 
          mountPath: /music
      nodeSelector:
        kubernetes.io/hostname: caturra
      securityContext:
        fsGroup: 1000
      volumes:
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
      - name: config
        hostPath:
          path: /mnt/lidarr
          type: DirectoryOrCreate
      - name: music
        hostPath:
          path: /mnt/music
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  labels:
    app: lidarr
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/instance: streaming-stack
    app.kubernetes.io/part-of: streaming-stack
spec:
  selector:
    app: lidarr
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/instance: streaming-stack
  ports:
  - name: http
    port: 8686
    targetPort: 8686
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr
spec:
  rules:
  - host: lidarr.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: lidarr
              port:
                number: 8686
