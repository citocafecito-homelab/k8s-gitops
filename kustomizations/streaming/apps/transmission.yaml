apiVersion: v1
kind: ConfigMap
metadata:
  name: transmission-settings
data:
  settings.json: | 
    {
      "alt-speed-down": 50,
      "alt-speed-enabled": false,
      "alt-speed-time-begin": 540,
      "alt-speed-time-day": 127,
      "alt-speed-time-enabled": false,
      "alt-speed-time-end": 1020,
      "alt-speed-up": 50,
      "announce-ip": "",
      "announce-ip-enabled": false,
      "anti-brute-force-enabled": false,
      "anti-brute-force-threshold": 100,
      "bind-address-ipv4": "0.0.0.0",
      "bind-address-ipv6": "::",
      "blocklist-enabled": false,
      "blocklist-url": "http://www.example.com/blocklist",
      "cache-size-mb": 4,
      "default-trackers": "",
      "dht-enabled": true,
      "download-dir": "/downloads",
      "download-queue-enabled": false,
      "download-queue-size": 999,
      "encryption": 1,
      "idle-seeding-limit": 30,
      "idle-seeding-limit-enabled": false,
      "incomplete-dir": "/downloads/incomplete",
      "incomplete-dir-enabled": false,
      "lpd-enabled": false,
      "message-level": 2,
      "peer-congestion-algorithm": "",
      "peer-id-ttl-hours": 6,
      "peer-limit-global": 200,
      "peer-limit-per-torrent": 50,
      "peer-port": 51413,
      "peer-port-random-high": 65535,
      "peer-port-random-low": 49152,
      "peer-port-random-on-start": false,
      "peer-socket-tos": "le",
      "pex-enabled": true,
      "port-forwarding-enabled": true,
      "preallocation": 1,
      "prefetch-enabled": true,
      "queue-stalled-enabled": false,
      "queue-stalled-minutes": 30,
      "ratio-limit": 2,
      "ratio-limit-enabled": false,
      "rename-partial-files": true,
      "rpc-authentication-required": true,
      "rpc-bind-address": "0.0.0.0",
      "rpc-enabled": true,
      "rpc-host-whitelist": "0.0.0.0,192.168.1.0/24,127.0.0.1",
      "rpc-host-whitelist-enabled": true,
      "rpc-password": "{89c0e656f521af9dd3fc0b4bd2ff9c2935f88978FoYc70OL",
      "rpc-port": 9091,
      "rpc-socket-mode": "0750",
      "rpc-url": "/transmission/",
      "rpc-username": "catuai",
      "rpc-whitelist": "127.0.0.1",
      "rpc-whitelist-enabled": false,
      "scrape-paused-torrents-enabled": true,
      "script-torrent-added-enabled": false,
      "script-torrent-added-filename": "",
      "script-torrent-done-enabled": false,
      "script-torrent-done-filename": "",
      "script-torrent-done-seeding-enabled": false,
      "script-torrent-done-seeding-filename": "",
      "seed-queue-enabled": false,
      "seed-queue-size": 10,
      "speed-limit-down": 100,
      "speed-limit-down-enabled": false,
      "speed-limit-up": 100,
      "speed-limit-up-enabled": false,
      "start-added-torrents": true,
      "tcp-enabled": true,
      "torrent-added-verify-mode": "fast",
      "trash-original-torrent-files": false,
      "umask": "002",
      "upload-slots-per-torrent": 14,
      "utp-enabled": false,
      "watch-dir": "/watch",
      "watch-dir-enabled": true
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
      app.kubernetes.io/name: transmission
  template:
    metadata:
      labels:
        app: transmission
        app.kubernetes.io/name: transmission
        app.kubernetes.io/part-of: streaming-stack
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: transmission
        image: lscr.io/linuxserver/transmission:latest
        ports:
        - containerPort: 9091
          protocol: TCP
        - containerPort: 51413
          protocol: TCP
        - containerPort: 51413
          protocol: UDP
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - name: settings
          mountPath: /config
          subPath: settings.json
        - name: resume
          mountPath: /config/resume
        - name: torrents
          mountPath: /config/torrents
        - name: watch
          mountPath: /watch
        - name: downloads
          mountPath: /downloads
      nodeSelector:
        kubernetes.io/hostname: catuai
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      volumes:
      - name: settings
        configMap:
          name: transmission-settings
          defaultMode: 0644
      - name: resume
        hostPath:
          path: /mnt/transmission/resume
          type: DirectoryOrCreate
      - name: torrents
        hostPath:
          path: /mnt/transmission/torrents
          type: DirectoryOrCreate
      - name: watch
        hostPath:
          path: /mnt/transmission/watch
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
spec:
  selector:
    app: transmission
  ports:
  - name: webui
    port: 9091
    targetPort: 9091
    protocol: TCP
  - name: tcp
    port: 51413
    targetPort: 51413
    protocol: TCP
  - name: udp
    port: 51413
    targetPort: 51413
    protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: transmission-lb
  annotations:
    external-dns.alpha.kubernetes.io/hostname: transmission.lan
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.36
  ports:
  - name: webui
    port: 80
    targetPort: 9091
    protocol: TCP
  - name: tcp
    port: 51413
    targetPort: 51413
    protocol: TCP
  - name: udp
    port: 51413
    targetPort: 51413
    protocol: UDP
  selector:
    app: transmission