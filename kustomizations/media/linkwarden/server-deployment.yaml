apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkwarden
  labels:
    app: linkwarden
    app.kubernetes.io/name: linkwarden
    app.kubernetes.io/part-of: linkwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linkwarden
      app.kubernetes.io/name: linkwarden
  template:
    metadata:
      labels:
        app: linkwarden
        app.kubernetes.io/name: linkwarden
        app.kubernetes.io/part-of: linkwarden
      annotations:
        app.kubernetes.io/documentation: "https://github.com/linkwarden/linkwarden"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault"
        vault.hashicorp.com/agent-inject-secret-credentials: "secret/data/linkwarden"
        vault.hashicorp.com/agent-inject-template-environment.env: |
          {{- with secret "secret/data/linkwarden" -}}
          NEXTAUTH_SECRET="{{ .Data.data.NEXTAUTH_SECRET }}"
          SPACES_KEY="{{ .Data.data.S3_ACCESS_KEY_ID }}"
          SPACES_SECRET="{{ .Data.data.S3_SECRET_ACCESS_KEY }}"
          {{- end -}}
    spec:
      automountServiceAccountToken: true
      enableServiceLinks: false
      serviceAccountName: linkwarden
      containers:
      - name: linkwarden
        image: ghcr.io/linkwarden/linkwarden:latest
        workingDir: /data/apps/web
        command:
        - node
        - --env-file=/vault/secrets/environment.env
        - /data/node_modules/.bin/next
        - start
        envFrom:
        - configMapRef:
            name: linkwarden-config
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true