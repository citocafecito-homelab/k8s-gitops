apiVersion: v1
kind: Service
metadata:
  name: jellystat
  annotations:
    external-dns.alpha.kubernetes.io/hostname: stats.habiflix.lan
  labels:
    app.kubernetes.io/name: jellystat
    type: LoadBalancer
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.22
  selector:
    app.kubernetes.io/name: jellystat
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
  - name: internal
    protocol: TCP
    port: 3000
    targetPort: 3000