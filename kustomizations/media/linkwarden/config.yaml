# see https://github.com/linkwarden/linkwarden/blob/main/.env.sample
apiVersion: v1
kind: ConfigMap
metadata:
  name: linkwarden-config
data:
  # Nextjs
  NEXTAUTH_URL: "https://linkwarden.citocafecito.work/api/v1/auth"
  NEXT_PUBLIC_DISABLE_REGISTRATION: "true"

  # Mantenemos también las de SPACES por compatibilidad si algún otro componente las usa
  SPACES_REGION: "garage"
  SPACES_BUCKET_NAME: "linkwarden"
  SPACES_ENDPOINT: "http://garage.storage.svc.cluster.local:3900"
  SPACES_FORCE_PATH_STYLE: "true"