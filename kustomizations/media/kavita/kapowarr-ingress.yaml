apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kapowarr
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: kapowarr.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: kapowarr
              port:
                number: 5656
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kapowarr-local
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
  - host: kapowarr.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kapowarr
            port:
              number: 5656