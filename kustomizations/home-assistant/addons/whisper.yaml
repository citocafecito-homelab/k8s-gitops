apiVersion: v1
kind: PersistentVolume
metadata:
  name: whisper-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  hostPath:
    path: /mnt/whisper
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
      app.kubernetes.io/name: whisper
  template:
    metadata:
      labels:
        app: whisper
        app.kubernetes.io/name: whisper
      annotations:
        app.kubernetes.io/documentation: https://docs.linuxserver.io/images/docker-faster-whisper/#docker-cli-click-here-for-more-info
    spec:
      containers:
      - name: whisper
        image: rhasspy/wyoming-whisper:latest
        args:
          - "--model"
          - "small"
          - "--language"
          - "es"
          - "--compute-type"
          - "int8"
          - "--device"
          - "cpu"
          - "--beam-size"
          - "1"
        env:
        - name: HF_HOME
          value: "/data/.huggingface"
        - name: XDG_CACHE_HOME
          value: "/data/.cache"
        ports:
        - containerPort: 10300
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "3000m"
            memory: "4Gi"
        securityContext:
          privileged: true
        volumeMounts:
        - name: dri
          mountPath: /dev/dri
        - name: whisper-config
          mountPath: /data
      nodeSelector:
        kubernetes.io/hostname: catimore
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups: [44, 107, 992]
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: whisper-config
        persistentVolumeClaim:
          claimName: whisper-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
spec:
  selector:
    app: whisper
  ports:
  - name: wyoming
    port: 10300
    targetPort: 10300
    protocol: TCP
