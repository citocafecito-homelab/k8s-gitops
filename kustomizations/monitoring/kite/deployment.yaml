apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: monitoring
  labels:
    app.kubernetes.io/name: server
    tier: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
        tier: disposable
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault"
        vault.hashicorp.com/agent-extra-secret: "kite-templates"
        vault.hashicorp.com/agent-inject-secret-config.yml: "secret/data/kite"
        vault.hashicorp.com/agent-inject-template-file-config.yml: "/vault/custom/config.yml.tpl"
      #   vault.hashicorp.com/agent-inject-secret-database: "secret/data/kite"
      #   vault.hashicorp.com/agent-inject-template-database: |
      #     {{- with secret "secret/data/kite" -}}
      #     postgres://{{ .Data.data.DATABASE_USERNAME }}:{{ .Data.data.DATABASE_PASSWORD }}@kite-postgresql:5432/{{ .Data.data.DATABASE_NAME }}?sslmode=disable
      #     {{- end }}
    spec:
      serviceAccountName: kite-server
      containers:
        - name: kite
          image: ghcr.io/kite-org/kite:v0.18.0
          imagePullPolicy: IfNotPresent
          ports:
          - name: http
            containerPort: 8080
          env:
          # - name: KITE_ENCRYPT_KEY
          #   valueFrom:
          #     secretKeyRef:
          #       name: kite-secret
          #       key: KITE_ENCRYPT_KEY
          - name: DB_DSN
            valueFrom:
              secretKeyRef:
                name: kite-secret
                key: DB_DSN
          envFrom:
          - configMapRef:
              name: config
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 512Mi