apiVersion: v1
kind: PersistentVolume
metadata:
  name: music-assistant-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  hostPath:
    path: /mnt/music-assistant
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: music-assistant-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: music-assistant
      app.kubernetes.io/name: music-assistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: music-assistant
        app.kubernetes.io/name: music-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        appArmorProfile:
          type: Unconfined
      nodeSelector:
        kubernetes.io/hostname: castillo
      containers:
      - name: music-assistant
        image: ghcr.io/music-assistant/server:stable
        env:
          - name: LOG_LEVEL
            value: warning
        securityContext:
          privileged: true
          capabilities:
            add:
            - DAC_READ_SEARCH 
            - SYS_ADMIN
            - NET_ADMIN
        volumeMounts:
        - name: dri
          mountPath: /dev/dri
        - name: music-assistant-data
          mountPath: /data
        resources:
          requests:
            cpu: "100m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "1.5Gi"
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: music-assistant-data
        persistentVolumeClaim:
          claimName: music-assistant-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: music-assistant
spec:
  selector:
    app: music-assistant
  ports:
  - name: http
    protocol: TCP
    port: 8095
    targetPort: 8095
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: music-assistant
spec:
  rules:
  - host: musicassistant.lan
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: music-assistant
              port:
                number: 8095
