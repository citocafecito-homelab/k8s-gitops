apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/part-of: streaming-stack
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        # Group id (992) can be found running 
        # getent group render | cut -d: -f3
        fsGroup: 1000
        supplementalGroups: [44, 992]
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        env:
        - name: LIBVA_DRIVER_NAME
          value: "iHD"
        - name: JELLYFIN_CONFIG_DIR
          value: "/config/config"
        - name: JELLYFIN_DATA_DIR
          value: "/config"
        - name: JELLYFIN_METADATA_DIR
          value: "/config/metadata"
        - name: JELLYFIN_CACHE_DIR
          value: "/config/cache"
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        ports:
        - containerPort: 8096
          protocol: TCP
        - containerPort: 8920
          protocol: TCP
        - containerPort: 7359
          protocol: UDP
        - containerPort: 1900
          protocol: UDP
        resources:
          requests:
            cpu: "1"
            memory: "1Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          capabilities:
            add: ["SYS_RAWIO", "SETPCAP", "SYS_ADMIN"]
        startupProbe:
          httpGet:
            path: /
            port: 8096
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: dri
          mountPath: /dev/dri
          readOnly: false
        - name: shm
          mountPath: /dev/shm
        - name: transcodes
          mountPath: /cache/transcodes
        - name: config
          mountPath: /config
        - name: movies
          mountPath: /media/movies
        - name: series
          mountPath: /media/series
        - name: animes
          mountPath: /media/animes
        - name: animations
          mountPath: /media/animations
        - name: cartoons
          mountPath: /media/cartoons
        - name: records
          mountPath: /media/records
        - name: intros
          mountPath: /media/intros
        - name: concerts
          mountPath: /media/concerts
        - name: music
          mountPath: /music
        - name: playlists
          mountPath: /music/playlists
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: castillo
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: transcodes
        emptyDir:
          medium: Memory
          sizeLimit: 4Gi
      - name: config
        hostPath:
          path: /mnt/jellyfin
          type: DirectoryOrCreate
      - name: intros
        hostPath:
          path: /mnt/multimedia/intros
          type: DirectoryOrCreate
      - name: records
        hostPath:
          path: /mnt/multimedia2/records
          type: DirectoryOrCreate
      - name: movies
        persistentVolumeClaim:
          claimName: movies-pvc
      - name: series
        persistentVolumeClaim:
          claimName: series-pvc
      - name: animes
        hostPath:
          path: /mnt/multimedia/animes
          type: DirectoryOrCreate
      - name: animations
        hostPath:
          path: /mnt/animations
          type: DirectoryOrCreate
      - name: cartoons
        hostPath:
          path: /mnt/multimedia/cartoons
          type: DirectoryOrCreate
      - name: concerts
        hostPath:
          path: /mnt/multimedia/concerts
          type: DirectoryOrCreate
      - name: music
        nfs:
          server: 192.168.1.11
          path: /mnt/music
          readOnly: false
      - name: playlists
        configMap:
          name: shared-playlists
