# See https://docs.immich.app/install /environment-variables
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-config
data: 
  # Global 
  UPLOAD_LOCATION: "/data/uploads"
  IMMICH_PORT: "2283"
  IMMICH_MEDIA_LOCATION: "/data"
  IMMICH_SKIP_FOLDER_CHECKS: "true"
  # IMMICH_VIDEO_TRANSCODING_HWACCEL: "qsv"
  IMMICH_VIDEO_TRANSCODING_HWACCEL: "vaapi"
  IMMICH_WORKERS: "4"
  
  # Cache
  REDIS_HOSTNAME: "immich-valkey"
  REDIS_PORT: "6379"
  
  # Machine Learning 
  IMMICH_MACHINE_LEARNING_ENABLED: "false"
  # IMMICH_MACHINE_LEARNING_URL: "http://immich-machine-learning:3003"