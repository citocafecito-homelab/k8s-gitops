apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  annotations:
    external-dns.alpha.kubernetes.io/hostname: mosquitto.lan
  labels:
    app: mosquitto
    app.kubernetes.io/name: mosquitto
spec:
  loadBalancerIP: 192.168.1.20
  type: LoadBalancer
  selector:
    app: mosquitto
    app.kubernetes.io/name: mosquitto
  ports:
  - name: mqtt
    protocol: TCP
    port: 1883
    targetPort: 1883
  - name: http
    protocol: TCP
    port: 9001
    targetPort: 9001