apiVersion: v1
kind: PersistentVolume
metadata:
  name: matter-pv
spec:
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  nfs:
    server: 192.168.1.10
    path: /mnt/matter-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matter-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter
  labels:
    app.kubernetes.io/name: matter
    app.kubernetes.io/part-of: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matter
      app.kubernetes.io/name: matter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: matter
        app.kubernetes.io/name: matter
        app.kubernetes.io/part-of: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: matter
        image: ghcr.io/matter-js/python-matter-server:stable
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args: 
          - >
            INTERFACE=$(ip route get 8.8.8.8 | grep -oP 'dev \K\S+');
            python3 -m matter_server.server 
            --storage-path=/data
            --listen-address=0.0.0.0
            --paa-root-cert-dir /data/credentials
            --primary-interface=$INTERFACE
            --bluetooth-adapter=0
            --port=5582
        env:
        - name: LOG_LEVEL
          value: "debug"
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: CHIP_KVS_PATH
          value: "/data/chip_kvs"
        ports:
        - containerPort: 5582
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /
            port: 5582
        startupProbe:
          tcpSocket:
            port: 5582
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 10
        livenessProbe:
          tcpSocket:
            port: 5582
          initialDelaySeconds: 15
          periodSeconds: 20
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - NET_BROADCAST
            - NET_BIND_SERVICE
            - SYS_ADMIN
        volumeMounts:
        - name: matter-config
          mountPath: /data
        - name: dbus-socket
          mountPath: /run/dbus
        - name: sysfs
          mountPath: /sys
        - name: bluetooth-dev
          mountPath: /dev/bus/usb
      nodeSelector:
        kubernetes.io/hostname: caturra
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups:
        - 106
      volumes:
      - name: matter-config
        persistentVolumeClaim:
          claimName: matter-pvc
      - name: dbus-socket
        hostPath:
          path: /run/dbus
          type: Directory
      - name: sysfs
        hostPath:
          path: /sys
      - name: bluetooth-dev
        hostPath:
          path: /dev/bus/usb
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: matter
  labels:
    app.kubernetes.io/name: matter
    app.kubernetes.io/part-of: home-assistant
spec:
  selector:
    app: matter
  ports:
  - port: 5582
    targetPort: 5582
    protocol: TCP
    name: http