#Run it: kubectl create job --from=cronjob/split2flac "split2flac-manual-$(date +%Y%m%d-%H%M%S)" -n streaming
apiVersion: batch/v1
kind: CronJob
metadata:
  name: split2flac
  namespace: streaming
spec:
  schedule: "0 2 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: split2flac
            image: mikenye/split2flac
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -e

                echo "==== split2flac recursive scan ===="

                find /workdir -type f -iname "*.cue" | while read -r CUE; do
                  [ -z "$CUE" ] && continue

                  DIR=$(dirname "$CUE")
                  CUE_NAME=$(basename "$CUE")

                  # Extraer audio, quitar comillas y limpiar el \r de Windows
                  # Importante: Usamos la ruta completa $CUE para el grep inicial
                  AUDIO_FILE=$(grep -m 1 "FILE" "$CUE" | sed -e 's/FILE "\(.*\)" .*/\1/' | tr -d '\r')

                  cd "$DIR" || continue

                  if [ -z "$AUDIO_FILE" ]; then
                    echo "No FILE entry in $CUE_NAME"
                    continue
                  fi

                  if [ -f "${AUDIO_FILE}.split2flacdone" ]; then
                    echo "Skipping (Done): $AUDIO_FILE"
                    continue
                  fi

                  if [ ! -f "$AUDIO_FILE" ]; then
                    echo "Audio not found: $AUDIO_FILE"
                    continue
                  fi

                  echo "Processing: $AUDIO_FILE"

                  # /usr/bin/shnsplit -m "áaéeííóoúuñnÁAÉEIÍÓOÚUÑN" -f "$CUE_NAME" -t "tracks/%n - %a [%n] %t" -o flac "$AUDIO_FILE"
                  /usr/bin/shnsplit -f "$CUE_NAME" -t "%n - %a [%n] %t" -o flac "$AUDIO_FILE"

                  if [ $? -eq 0 ]; then
                    touch "${AUDIO_FILE}.split2flacdone"
                    echo "Success: $AUDIO_FILE"
                  else
                    echo "Error processing: $AUDIO_FILE"
                  fi

                  echo "==== Post-process check ===="
                  ls -R "tracks" 2>/dev/null || ls -R .
                done

                echo "==== Process Complete ===="
                exit 0
            envFrom:
            - configMapRef:
                name: streaming-stack-config
            volumeMounts:
            - name: dri
              mountPath: /dev/dri
              readOnly: false
            - name: music
              mountPath: /workdir
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            supplementalGroups: [44, 107, 992]
          nodeSelector:
            kubernetes.io/hostname: castillo
          volumes:
          - name: dri
            hostPath:
              path: /dev/dri
          - name: music
            persistentVolumeClaim:
              claimName: downloads-pvc
