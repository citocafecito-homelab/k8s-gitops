# Run kubectl apply -k https://github.com/intel/intel-device-plugins-for-kubernetes/deployments/gpu_plugin/overlays/nfd_labeled_nodes?ref=main
# Check GPU run: sudo intel_gpu_top
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
      app.kubernetes.io/name: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        app.kubernetes.io/name: jellyfin
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        env:
        - name: LIBVA_DRIVER_NAME
          value: "iHD"
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        ports:
        - containerPort: 8096
          protocol: TCP
        - containerPort: 8920
          protocol: TCP
        - containerPort: 7359
          protocol: UDP
        - containerPort: 1900
          protocol: UDP
        resources:
          requests:
            memory: 2Gi
            cpu: .5
          limits:
            cpu: 2
            memory: 8Gi
        securityContext:
          runAsUser: 0
          runAsGroup: 0
          privileged: true
          capabilities:
            add: ["SYS_RAWIO"]
        startupProbe:
          httpGet:
            path: /
            port: 8096
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - mountPath: /dev/dri
          name: dri
        - mountPath: /dev/shm
          name: shm
        - name: transcode-overlay
          mountPath: /cache/transcode
        - name: config
          mountPath: /config
        - name: movies
          mountPath: /media/movies
        - name: series
          mountPath: /media/series
        - name: concerts
          mountPath: /media/concerts
        - name: music
          mountPath: /music
        - name: playlists
          mountPath: /music/playlists
          readOnly: true
      initContainers:
      - name: overlay-init
        image: alpine:latest
        securityContext:
          privileged: true
        command:
          - sh
          - -c
          - |
            set -e

            # Crear estructura real
            mkdir -p /ram/upper
            mkdir -p /ram/work
            mkdir -p /disk
            mkdir -p /merged

            # Montar overlay correctamente
            mount -t overlay overlay \
              -o lowerdir=/disk,upperdir=/ram/upper,workdir=/ram/work \
              /merged
        volumeMounts:
          - name: transcode-ram
            mountPath: /ram
          - name: transcode-disk
            mountPath: /disk
          - name: transcode-overlay
            mountPath: /merged
      nodeSelector:
        kubernetes.io/hostname: catuai
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 2Gi
      - name: transcode-ram
        emptyDir:
          medium: Memory
          sizeLimit: 5Gi
      - name: transcode-disk
        hostPath:
          path: /mnt/multimedia/transcoding
          type: DirectoryOrCreate
      - name: transcode-overlay
        emptyDir: {}
      - name: config
        hostPath:
          path: /mnt/jellyfin
          type: DirectoryOrCreate
      - name: movies
        persistentVolumeClaim:
          claimName: movies-pvc
      - name: series
        persistentVolumeClaim:
          claimName: series-pvc
      - name: concerts
        persistentVolumeClaim:
          claimName: concerts-pvc
      - name: music
        persistentVolumeClaim:
          claimName: music-pvc
      - name: playlists
        configMap:
          name: shared-playlists
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  annotations:
    tailscale.com/expose: "true"
  labels:
    app: jellyfin
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: streaming-stack
spec:
  selector:
    app: jellyfin
  ports:
  - name: http
    port: 8096
    targetPort: 8096
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-lb
  annotations:
    external-dns.alpha.kubernetes.io/hostname: habiflix.lan
  labels:
    type: LoadBalancer
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.40
  selector:
    app: jellyfin
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8096
  - name: udp
    protocol: UDP
    port: 7359
    targetPort: 7359
  
