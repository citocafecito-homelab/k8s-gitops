nameReference:
  # PVC -> PV
  - kind: PersistentVolume
    version: v1
    fieldSpecs:
      - kind: PersistentVolumeClaim
        version: v1
        path: spec/volumeName

  # StatefulSet -> ServiceAccount
  - kind: ServiceAccount
    version: v1
    fieldSpecs:
      - kind: StatefulSet
        version: apps/v1
        path: spec/template/spec/serviceAccountName
      - kind: StatefulSet
        version: apps/v1
        path: spec/template/spec/serviceAccount

  # StatefulSet -> Service (serviceName)
  - kind: Service
    version: v1
    fieldSpecs:
      - kind: StatefulSet
        version: apps/v1
        path: spec/serviceName

  # Deployment -> ConfigMap (envFrom)
  - kind: ConfigMap
    version: v1
    fieldSpecs:
      - kind: Deployment
        version: apps/v1
        path: spec/template/spec/containers/envFrom/configMapRef/name