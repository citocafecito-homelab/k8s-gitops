apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyswarm
  namespace: streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyswarm
      app.kubernetes.io/name: jellyswarm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyswarm
        app.kubernetes.io/name: jellyswarm
        app.kubernetes.io/part-of: streaming-stack
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault"
        vault.hashicorp.com/agent-inject-secret-jellyswarrm.toml: "secret/data/jellyfin"
        vault.hashicorp.com/agent-inject-template-jellyswarrm.toml: |
          {{- with secret "secret/data/jellyfin" -}}
          auto_create_users_on_login    = true
          include_server_name_in_media  = false
          deduplicate_media             = true  

          server_id   = "3194691f8f604aa8bb24f4c954233de2"
          server_name = "Habiflix"
          session_key = "{{ .Data.data.SESSION_KEY }}"

          username = "{{ .Data.data.USERNAME }}"
          password = "{{ .Data.data.PASSWORD }}"

          [[preconfigured_servers]]
          url                   = "http://jellyfin:8096"
          name                  = "Main Server"
          priority              = 101
          media_streaming_mode  = "Proxy"

          [[preconfigured_servers]]
          url                   = "http://jellyfin-replica:8096"
          name                  = "Replica Server"
          priority              = 102
          media_streaming_mode  = "Proxy"
          {{- end -}}
    spec:
      enableServiceLinks: false
      serviceAccountName: jellyswarm
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - caturra
                - catimore
      containers:
      - name: jellyswarm
        image: ghcr.io/llukas22/jellyswarrm:main
        command:
        - sh
        - -c
        - |
          mkdir -p /app/data
          cp /vault/secrets/jellyswarrm.toml /app/data/jellyswarrm.toml
          exec /app/jellyswarrm-proxy
        ports:
        - containerPort: 3000
          name: http
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
