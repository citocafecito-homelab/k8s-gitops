apiVersion: v1
kind: ConfigMap
metadata:
  name: lidarr-scripts
data:
  install-deps.sh: |
    #!/bin/bash
    echo "--- Detectado Alpine: Instalando con apk ---"
    # bpm-tools no está en los repos oficiales de Alpine, 
    # pero podemos usar aubio y flac que son los que necesitas para los FLAC.
    apk add --no-cache flac aubio aubio-tools
    echo "--- Instalación finalizada ---"

  bpm-processor.sh: |
      #!/bin/bash

      # Lidarr usa variables de entorno para pasar la ruta del archivo.
      # Usamos lidarr_trackfile_path que contiene la ruta absoluta del archivo importado.
      FILE="${lidarr_trackfile_path}"

      if [ "$lidarr_eventtype" == "Test" ]; then
        echo "Prueba de conexión exitosa con Lidarr."
        exit 0
      fi

      # Verificación de seguridad: si la variable está vacía, no hace nada.
      if [ -z "$FILE" ]; then
        echo "Error: No se recibió la ruta del archivo desde Lidarr."
        exit 1
      fi

      # 1. Calcular BPM con aubio
      # Se procesa un solo archivo a la vez, eliminando la necesidad del bucle 'find'.
      BPM=$(aubio tempo "$FILE" 2>/dev/null | head -n 1 | awk '{print int($1)}')

      # Validar que se obtuvo un valor numérico
      if [ -z "$BPM" ] || [ "$BPM" -eq 0 ]; then
        echo "Saltando: No se pudo detectar BPM para $FILE"
        exit 0 # Salida exitosa para no bloquear el flujo de Lidarr[cite: 250, 251].
      fi

      echo "Procesando [$BPM BPM]: $FILE"

      # 2. Asignar etiquetas según la extensión del archivo
      case "$FILE" in
        *.m4a)
            AtomicParsley "$FILE" --bpm "$BPM" --overWrite
            ;;
        *.flac)
            metaflac --remove-tag=BPM --set-tag="BPM=$BPM" "$FILE"
            ;;
        *.mp3)
            mid3v2 --TBP "$BPM" "$FILE" > /dev/null
            ;;
      esac

      echo "¡BPM asignado correctamente!"

  notify-arrival.sh: |
    #!/bin/bash
    echo "Nuevo álbum importado: $lidarr_album_title"
    # Aquí podrías poner un curl a Telegram o Discord
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lidarr
  labels:
    app: lidarr
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/instance: streaming-stack
    app.kubernetes.io/part-of: streaming-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lidarr
      app.kubernetes.io/name: lidarr
      app.kubernetes.io/instance: streaming-stack
  template:
    metadata:
      labels:
        app: lidarr
        app.kubernetes.io/name: lidarr
        app.kubernetes.io/instance: streaming-stack
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: lidarr
        image: lscr.io/linuxserver/lidarr:latest
        ports:
        - containerPort: 8686
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 8686
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8686
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
        - name: lidarr-scripts-vol
          mountPath: /scripts
        - name: lidarr-scripts-vol
          mountPath: /custom-cont-init.d/install-deps.sh
          subPath: install-deps.sh
        - name: downloads
          mountPath: /downloads
        - name: music 
          mountPath: /music
      nodeSelector:
        kubernetes.io/hostname: catimore
      securityContext:
        fsGroup: 1000
      volumes:
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
      - name: config
        hostPath:
          path: /mnt/lidarr
          type: DirectoryOrCreate
      - name: lidarr-scripts-vol
        configMap:
          name: lidarr-scripts
          defaultMode: 0755
      - name: music
        hostPath:
          path: /mnt/music
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: lidarr
  labels:
    app: lidarr
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/instance: streaming-stack
    app.kubernetes.io/part-of: streaming-stack
spec:
  selector:
    app: lidarr
    app.kubernetes.io/name: lidarr
    app.kubernetes.io/instance: streaming-stack
  ports:
  - name: http
    port: 8686
    targetPort: 8686
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: lidarr.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: lidarr
              port:
                number: 8686
