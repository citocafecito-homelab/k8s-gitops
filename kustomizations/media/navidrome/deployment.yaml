# find /media/music -type f -name "*.mp3" -exec bpm-tag -f {} \;
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  labels:
    app: navidrome
    tier: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app: navidrome
        app.kubernetes.io/name: navidrome
    spec:
      enableServiceLinks: false
      initContainers:
      - name: init-playlist-dirs
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            mkdir -p /music/jasa1999/playlists
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
          - name: music
            mountPath: /music
      containers:
      - name: navidrome
        image: deluan/navidrome:latest
        ports:
        - containerPort: 4533
          name: http
        resources:
          requests:
            cpu: "5m"
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
        envFrom:
        - configMapRef:
            name: navidrome-config
        env:
        - name: ND_LASTFM_APIKEY
          valueFrom:
            secretKeyRef:
              name: navidrome-lastfm-secret
              key: ND_LASTFM_APIKEY
        - name: ND_LASTFM_SECRET
          valueFrom:
            secretKeyRef:
              name: navidrome-lastfm-secret
              key: ND_LASTFM_SECRET
        securityContext:
          privileged: false
        volumeMounts:
        - name: cache
          mountPath: /data/cache
        - name: dri
          mountPath: /dev/dri
        - name: data
          mountPath: /data
        - name: music
          mountPath: /music
          readOnly: true
        - name: hmanzur-playlists
          mountPath: /music/hmanzur/playlists
          readOnly: false
        - name: jasa1999-playlists
          mountPath: /music/jasa1999/playlists
          readOnly: false
      nodeSelector:
        kubernetes.io/hostname: catimore
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups: [44, 107, 992]
      volumes:
      - name: cache
        emptyDir:
          medium: Memory
          sizeLimit: "1Gi"
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      - name: data
        persistentVolumeClaim:
          claimName: navidrome-pvc
      - name: music
        persistentVolumeClaim:
          claimName: music-pvc
      - name: hmanzur-playlists
        configMap:
          name: hmanzur-playlists
      - name: jasa1999-playlists
        configMap:
          name: jasa1999-playlists