apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
      app.kubernetes.io/name: transmission
  template:
    metadata:
      labels:
        app: transmission
        app.kubernetes.io/name: transmission
        app.kubernetes.io/part-of: streaming-stack
      annotations:
        app.kubernetes.io/documentation: "https://docs.linuxserver.io/images/docker-transmission/"
        vault.hashicorp.com/agent-inject: "true"
        #
        ## --- Transmission
        #
        vault.hashicorp.com/role: vault
        vault.hashicorp.com/agent-inject-secret-transmission: "secret/data/transmission"
        vault.hashicorp.com/agent-inject-template-transmission: |
          {{- with secret "secret/data/transmission" -}}
          {{ .Data.data.USERNAME | writeToFile "/vault/secrets/user" "vault" "vault" "0640" }}
          {{ .Data.data.PASSWORD | writeToFile "/vault/secrets/password" "vault" "vault" "0640" }}
          {{- end -}}
        #
        ## --- PIA VPN
        #
        # vault.hashicorp.com/agent-inject-secret-auth.conf: "secret/data/pia"
        # vault.hashicorp.com/agent-inject-perms-auth.conf: "0600"
        # vault.hashicorp.com/agent-inject-template-auth.conf: |
        #   {{- with secret "secret/data/pia" -}}
        #   {{ .Data.data.username | trimSpace }}
        #   {{ .Data.data.password | trimSpace }}
        #   {{- end -}}
        vault.hashicorp.com/agent-inject-secret-vpn: "secret/data/pia"
        vault.hashicorp.com/agent-inject-template-vpn: |
          {{- with secret "secret/data/pia" -}}
          {{ .Data.data.username | writeToFile "/vault/secrets/vpn_user" "vault" "vault" "0640" }}
          {{ .Data.data.password | writeToFile "/vault/secrets/vpn_pass" "vault" "vault" "0640" }}
          {{- end -}}
    spec:
      # dnsPolicy: None
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 60
      containers:
      - name: transmission
        image: lscr.io/linuxserver/transmission:latest
        ports:
        - containerPort: 9091
          protocol: TCP
        - containerPort: 51413
          protocol: TCP
        - containerPort: 51413
          protocol: UDP
        env:
          - name: "FILE__USER"
            value: "/vault/secrets/user"
          - name: "FILE__PASS"
            value: "/vault/secrets/password"
          - name: TRANSMISSION_BIND_ADDRESS_IPV4
            value: "10.14.18.100"
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 250m
            memory: 1Gi
        volumeMounts:
        - name: scripts
          mountPath: /custom-cont-init.d/01-setup-config.sh
          subPath: 01-setup-config.sh
        - name: scripts
          mountPath: /scripts
        - name: config
          mountPath: /config
        - name: watch
          mountPath: /watch
        - name: downloads
          mountPath: /downloads
      - name: tagger
        image: lscr.io/linuxserver/transmission:latest
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "[SIDECAR] Esperando inicialización..."
            # Aseguramos que el archivo exista antes de empezar
            touch /config/pending_tags.txt
            # Ejecutamos tu script robusto
            /scripts/tagger-daemon.sh
        env:
          - name: "FILE__USER"
            value: "/vault/secrets/user"
          - name: "FILE__PASS"
            value: "/vault/secrets/password"
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: config
          mountPath: /config
      - name: vpn
        image: qmcgaw/gluetun
        securityContext:
          capabilities:
            add: ["NET_ADMIN"]
        env:
        - name: VPN_SERVICE_PROVIDER
          value: "private internet access"
        - name: OPENVPN_USER_SECRETFILE
          value: "/vault/secrets/vpn_user"
        - name: OPENVPN_PASSWORD_SECRETFILE
          value: "/vault/secrets/vpn_pass"
        - name: SERVER_REGIONS
          value: "US East"
        - name: 
        # - name: DOTBYPASS_ADDRS
        #   value: "192.168.1.0/24,10.96.0.0/12"
        # - name: FIREWALL_OUTBOUND_SUBNETS
        #   value: "192.168.1.0/24,10.96.0.0/12"
        # - name: DNS_KEEP_NAMESERVER
        #   value: "on"
        # - name: FIREWALL_INPUT_PORTS
        #   value: "51413"
        # - name: VPN_PORT_FORWARDING
        #   value: "on"
        # - name: VPN_PORT_FORWARDING
        #   value: "on"
        # - name: VPN_PORT_FORWARDING_STATUS_FILE
        #   value: "/config/pia_port.txt"
      # - name: vpn
      #   image: itsdaspecialk/pia-openvpn
      #   securityContext:
      #     privileged: true
      #     capabilities:
      #       add: ["NET_ADMIN"]
      #   env:
      #   - name: REGION
      #     value: "us_east"
      #   - name: LOCAL_NETWORK
      #     value: "192.168.1.0/24,10.96.0.0/12"
      #   - name: PORT_FORWARDING
      #     value: "false"
      #   args: 
      #     - "--auth-user-pass /vault/secrets/auth.conf"
      #     - "--auth-nocache"
      #   volumeMounts:
      #   - name: dev-net-tun
      #     mountPath: /dev/net/tun
      # dnsConfig:
      #   nameservers:
      #     - 10.96.0.10      # IP estándar de CoreDNS en K8s
      #     - 209.222.18.222  # PIA
      #   options:
      #     - name: ndots
      #       value: "2"
      #   searches:
      #     - streaming.svc.cluster.local
      #     - svc.cluster.local
      #     - cluster.local
      nodeSelector:
        kubernetes.io/hostname: catuai
      securityContext:
        fsGroup: 1000
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: dev-net-tun
        hostPath:
          path: /dev/net/tun
      - name: scripts
        configMap:
          name: transmission-scripts
          defaultMode: 0755
      - name: config
        hostPath:
          path: /mnt/transmission
          type: Directory
      - name: watch
        hostPath:
          path: /mnt/transmission/watch
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc