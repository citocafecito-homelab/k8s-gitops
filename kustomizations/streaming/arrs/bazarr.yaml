apiVersion: apps/v1
kind: Deployment
metadata:
  name: bazarr
  labels:
    app: bazarr
    app.kubernetes.io/name: bazarr
    app.kubernetes.io/instance: streaming-stack
    app.kubernetes.io/part-of: streaming-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bazarr
      app.kubernetes.io/name: bazarr
      app.kubernetes.io/instance: streaming-stack
  template:
    metadata:
      labels:
        app: bazarr
        app.kubernetes.io/name: bazarr
        app.kubernetes.io/instance: streaming-stack
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: bazarr
        image: lscr.io/linuxserver/bazarr:latest
        ports:
        - containerPort: 6767
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        resources:
          requests:
            memory: 256Mi
            cpu: 100m
          limits:
            memory: 1Gi
        # securityContext:
        #   privileged: true
        #   allowPrivilegeEscalation: true
        #   capabilities:
        #     drop: [ "ALL" ]
        #     add: [ "CHOWN", "SETGID", "SETUID", "SETPCAP" ]
        livenessProbe:
          httpGet:
            path: /
            port: 6767
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /
            port: 6767
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: dri
          mountPath: /dev/dri
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        - name: movies
          mountPath: /movies
        - name: series
          mountPath: /tv
        - name: animes
          mountPath: /animes
        - name: animations
          mountPath: /animations
        - name: cartoons
          mountPath: /cartoons
      nodeSelector:
        kubernetes.io/hostname: castillo
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups: [44, 107, 992]
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: config
        hostPath:
          path: /mnt/bazarr
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim: 
          claimName: downloads-pvc
      - name: movies
        persistentVolumeClaim:
          claimName: movies-pvc
      - name: series
        persistentVolumeClaim:
          claimName: series-pvc
      - name: animes
        hostPath:
          path: /mnt/multimedia/animes
          type: DirectoryOrCreate
      - name: animations
        hostPath:
          path: /mnt/animations
          type: DirectoryOrCreate
      - name: cartoons
        hostPath:
          path: /mnt/multimedia/cartoons
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  labels:
    app: bazarr
    app.kubernetes.io/name: bazarr
    app.kubernetes.io/instance: streaming-stack
    app.kubernetes.io/part-of: streaming-stack
spec:
  selector:
    app: bazarr
    app.kubernetes.io/name: bazarr
    app.kubernetes.io/instance: streaming-stack
  ports:
  - name: http
    port: 6767
    targetPort: 6767
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bazarr
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: bazarr.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: bazarr
              port:
                number: 6767