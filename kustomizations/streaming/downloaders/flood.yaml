apiVersion: apps/v1
kind: Deployment
metadata:
  name: flood
  labels:
    app: flood
spec:
  replicas: 0
  selector:
    matchLabels:
      app: flood
      app.kubernetes.io/name: flood
      app.kubernetes.io/part-of: streaming-stack
  template:
    metadata:
      labels:
        app: flood
        app.kubernetes.io/name: flood
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: flood
        image: jesec/flood:master-distroless
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        ports:
        - containerPort: 3000
        - containerPort: 4200
        volumeMounts:
        # - name: downloads
        #   mountPath: /home/download
        - name: data
          mountPath: /data
      volumes:
      # - name: downloads
      #   persistentVolumeClaim:
      #     claimName: downloads-pvc
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: flood
spec:
  selector:
    app: flood
  ports:
  - name: webui
    port: 3000
    targetPort: 3000
  - name: tcp
    port: 4200
    targetPort: 4200
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flood
spec:
  rules:
  - host: flood.citocafecito.work
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flood
            port:
              number: 3000