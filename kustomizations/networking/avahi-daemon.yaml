apiVersion: v1
kind: ConfigMap
metadata:
  name: avahi-config
  namespace: kube-system
data:
  avahi-daemon.conf: |
    [server]
    use-ipv4=yes
    use-ipv6=no
    enable-dbus=no
    
    [reflector]
    enable-reflector=yes
    reflect-ipv=yes

    [rlimits]
    rlimit-core=0
    rlimit-data=4194304
    rlimit-fsize=0
    rlimit-nofile=768
    rlimit-stack=4194304
    rlimit-nproc=3
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: avahi-reflector
spec:
  selector:
    matchLabels:
      app: avahi-reflector
  template:
    metadata:
      labels:
        app: avahi-reflector
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
      - name: init-config
        image: busybox:latest
        command: ['sh', '-c', 'cp /config-src/avahi-daemon.conf /etc/avahi-dst/avahi-daemon.conf']
        volumeMounts:
        - name: config-src
          mountPath: /config-src
        - name: config-dst
          mountPath: /etc/avahi-dst
      containers:
      - name: avahi
        image: ydkn/avahi:latest
        # Sobrescribimos el entrypoint para evitar que corra el script sed
        command: ["avahi-daemon"]
        args: ["-f", "/etc/avahi/avahi-daemon.conf"]
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        volumeMounts:
        - name: config-dst
          mountPath: /etc/avahi
      volumes:
      - name: config-src
        configMap:
          name: avahi-config
      - name: config-dst
        emptyDir: {}