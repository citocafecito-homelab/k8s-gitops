apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: garage-webui-scaledobject
  namespace: storage
spec:
  scaleTargetRef:
    name: garage-webui
  minReplicaCount: 0
  maxReplicaCount: 2
  triggers:
  - type: http
    metadata:
      scalerAddress: http://keda-add-on-http-interceptor-proxy.keda.svc.cluster.local:8080
      targetPendingRequests: "5"
      host: garage.lan