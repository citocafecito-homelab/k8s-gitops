apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mixpost
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: mixpost.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: mixpost
              port:
                number: 80