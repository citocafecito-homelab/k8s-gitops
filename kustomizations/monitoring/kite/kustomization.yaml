apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namePrefix: kite-

components:
  - ../../../components/postgresql

generatorOptions:
  disableNameSuffixHash: true
  
secretGenerator:
  - name: templates
    files:
      - templates/config.yml.tpl

labels:
  - pairs:
      app.kubernetes.io/part-of: kite
    includeSelectors: false

resources:
- sa.yaml
- rbac.yaml
- config.yaml

# Postgresql
# - database-pv.yaml
# - database-deployment.yaml
# - database-svc.yaml

# Kite
- server-deployment.yaml
- server-svc.yaml
- server-ingress.yaml