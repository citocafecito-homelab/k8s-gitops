apiVersion: apps/v1
kind: Deployment
metadata:
  name: byparr
  labels:
    app: byparr
    app.kubernetes.io/name: byparr
    tier: disposable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: byparr
      app.kubernetes.io/name: byparr
  template:
    metadata:
      labels:
        app: byparr
        app.kubernetes.io/name: byparr
    spec:
      terminationGracePeriodSeconds: 30
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                - caturra
      containers:
      - name: byparr
        image: ghcr.io/thephaseless/byparr:latest
        ports:
        - containerPort: 8000
        env:
        - name: BROWSER_LOCALE
          value: "es-CO"
        - name: TZ
          value: "America/Bogota"
        - name: LOG_LEVEL
          value: 'info'
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 2
            memory: 3Gi
        volumeMounts:
        - name: dshm
          mountPath: /dev/shm
        - name: tmp-dir
          mountPath: /tmp
        - name: cache-dir
          mountPath: /cache
      tolerations:
      - key: node-role.control-plane
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: tmp-dir
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
      - name: cache-dir
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi