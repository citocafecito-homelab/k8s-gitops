apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: deployment.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      labelSelector: wait-database=true

configurations:
  - kustomizeconfig.yaml

resources:
  - sa.yaml
  - pv.yaml
  - pvc.yaml
  - statefulset.yaml
  - svc.yaml