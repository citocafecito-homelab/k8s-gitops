apiVersion: v1
kind: Service
metadata:
  name: seerr-lb
  annotations:
    external-dns.alpha.kubernetes.io/hostname: seerr.lan
  labels:
    type: LoadBalancer
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.41
  selector:
    app: seerr
  ports:
  - name: webui
    protocol: TCP
    port: 80
    targetPort: 5055
  - name: http
    port: 5055
    targetPort: 5055