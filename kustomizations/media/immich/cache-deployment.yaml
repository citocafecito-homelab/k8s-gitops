apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey
  labels:
    app: immich-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich-valkey
  template:
    metadata:
      labels:
        app: immich-valkey
    spec:
      containers:
      - name: valkey
        image: valkey/valkey:latest
        args:
          - "--save"
          - ""
          - "--appendonly"
          - "no"
        ports:
        - containerPort: 6379
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 50m
            memory: 128Mi
