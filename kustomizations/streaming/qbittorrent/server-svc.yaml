apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-headless
spec:
  clusterIP: None
  selector:
    app: qbittorrent
  ports:
  - name: webui
    port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent-web
spec:
  type: ClusterIP
  selector:
    app: qbittorrent
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  annotations:
    external-dns.alpha.kubernetes.io/hostname: qbittorrent.lan
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.35
  selector:
    app: qbittorrent
  ports:
  - name: default
    port: 80
    targetPort: 8080
  - name: webui
    port: 8080
    targetPort: 8080