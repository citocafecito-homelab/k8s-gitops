apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pihole
  namespace: networking
spec:
  serviceName: "pihole"
  replicas: 2
  selector:
    matchLabels:
      app: pihole
      app.kubernetes.io/name: pihole
  template:
    metadata:
      labels:
        app: pihole
        app.kubernetes.io/name: pihole
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault"
        vault.hashicorp.com/agent-inject-secret-admin_password: "secret/data/pihole"
        vault.hashicorp.com/agent-inject-template-admin_password: |
          {{- with secret "secret/data/pihole" -}}
          {{ .Data.data.WEBPASSWORD }}
          {{- end }}
        vault.hashicorp.com/agent-inject-secret-api_key: "secret/data/pihole"
        vault.hashicorp.com/agent-inject-template-api_key: |
          {{- with secret "secret/data/pihole" -}}
          {{ .Data.data.API_KEY }}
          {{- end }}
    spec:
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      terminationGracePeriodSeconds: 10
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - catuai
                - castillo
      # initContainers:
      # - name: pihole-api-provisioner
      #   image: alpine:latest
      #   command: ["/bin/sh", "-c"]
      #   args:
      #   - |
      #     # Asegurar que el directorio de datos exista
      #     mkdir -p /etc/pihole
          
      #     # Instalar sqlite3 de forma temporal en el initContainer
      #     apk add --no-cache sqlite-dev sqlite
          
      #     if [ -f /vault/secrets/api_key ]; then
      #       TOKEN=$(cat /vault/secrets/api_key)
      #       echo "Inyectando API_KEY compartida en gravity.db..."
            
      #       # Pi-hole v6 almacena los App Tokens autorizados en la tabla 'auth'
      #       sqlite3 /etc/pihole/gravity.db "CREATE TABLE IF NOT EXISTS auth (id INTEGER PRIMARY KEY, token TEXT UNIQUE, name TEXT);"
      #       sqlite3 /etc/pihole/gravity.db "INSERT OR REPLACE INTO auth (id, token, name) VALUES (1, '$TOKEN', 'nebula-sync-token');"
      #     fi
      #   volumeMounts:
      #   - name: pihole-etc
      #     mountPath: /etc/pihole
      containers:
      - name: pihole
        image: pihole/pihole:latest
        envFrom:
        - configMapRef:
            name: pihole-env
        ports:
        - name: dhcp
          containerPort: 67
          hostPort: 67
          protocol: UDP
        - name: dns-tcp
          containerPort: 53
          hostPort: 53
          protocol: TCP
        - name: dns-udp
          containerPort: 53
          hostPort: 53
          protocol: UDP
        resources:
          requests:
            cpu: 100m
            memory: 1024Mi
          limits:
            cpu: 300m
            memory: 2048Mi
        securityContext:
          capabilities:
            add:
            - CHOWN
            - NET_ADMIN
            - NET_BIND_SERVICE
            - NET_RAW
            - SYS_NICE
            - SYS_TIME
        volumeMounts:
        - name: pihole-etc
          mountPath: /etc/pihole
        - name: shm-volume
          mountPath: /dev/shm
        - name: custom-dns
          mountPath: /etc/dnsmasq.d/custom.conf
          subPath: custom.conf
        - name: adlists
          mountPath: /etc/pihole/adlists.list
          subPath: adlists.list
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      volumes:
      - name: shm-volume
        emptyDir:
          medium: Memory
          sizeLimit: 256Mi
      - name: custom-dns
        configMap:
          name: pihole-custom-dns
      - name: adlists
        configMap:
          name: pihole-adlists
      - name: pihole-etc
        hostPath:
          path: /mnt/pihole
          type: DirectoryOrCreate