apiVersion: apps/v1
kind: Deployment
metadata:
  name: matter
  labels:
    app.kubernetes.io/name: matter
    app.kubernetes.io/part-of: home-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matter
      app.kubernetes.io/name: matter
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: matter
        app.kubernetes.io/name: matter
        app.kubernetes.io/part-of: home-assistant
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: matter
        image: ghcr.io/matter-js/matterjs-server:latest
        env:
        - name: PRODUCTION_MODE
          value: "true"
        ports:
        - containerPort: 5580
        - containerPort: 5582
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: true
          privileged: false
          capabilities:
            add:
            - NET_ADMIN
            - NET_RAW
            - NET_BROADCAST
            - NET_BIND_SERVICE
            - SYS_ADMIN
        volumeMounts:
        - name: matter-config
          mountPath: /data
        - name: dbus-socket
          mountPath: /run/dbus
        - name: sysfs
          mountPath: /sys
        - name: bluetooth-dev
          mountPath: /dev/bus/usb
      nodeSelector:
        kubernetes.io/hostname: catuai
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: matter-config
        persistentVolumeClaim:
          claimName: matter-pvc
      - name: dbus-socket
        hostPath:
          path: /run/dbus
          type: Directory
      - name: sysfs
        hostPath:
          path: /sys
      - name: bluetooth-dev
        hostPath:
          path: /dev/bus/usb
          type: DirectoryOrCreate