apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkstack
  labels:
    app: linkstack
    app.kubernetes.io/name: linkstack
    app.kubernetes.io/part-of: linkstack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linkstack
      app.kubernetes.io/name: linkstack
  template:
    metadata:
      labels:
        app: linkstack
        app.kubernetes.io/name: linkstack
        app.kubernetes.io/part-of: linkstack
    spec:
      # initContainers:
      # - name: validate-mysql-connection
      #   image: mysql:9.6
      #   command:
      #     - sh
      #     - -c
      #     - |
      #       echo "Intentando conectar a MySQL..."
      #       until mysqladmin ping -h "${MYSQL_HOST:-localhost}" -u"${MYSQL_USER}" -p"${MYSQL_PASSWORD}" --silent; do
      #         echo "Esperando a que MySQL esté disponible..."
      #         sleep 2
      #       done
      #       echo "Conexión a MySQL establecida exitosamente."
      #   envFrom:
      #   - configMapRef:
      #       name: linkstack-database
      containers:
      - name: linkstack
        image: ghcr.io/linkstackorg/linkstack:latest
        ports:
        - name: http
          containerPort: 80
        - name: https
          containerPort: 443
        env:
        - name: DB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: linkstack-database
              key: MYSQL_DATABASE
        - name: DB_USERNAME
          valueFrom:
            configMapKeyRef:
              name: linkstack-database
              key: MYSQL_USER
        - name: DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: linkstack-database
              key: MYSQL_PASSWORD
        envFrom:
        - configMapRef:
            name: linkstack-config
        resources:
          requests:
            cpu: 40m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 512Mi 
