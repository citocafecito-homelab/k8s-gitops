apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: streaming
  labels:
    app: jellyfin
    app.kubernetes.io/name: jellyfin
    app.kubernetes.io/part-of: streaming-stack
    app.kubernetes.io/volume-multimedia: attached
    app.kubernetes.io/volume-multimedia2: attached
    app.kubernetes.io/volume-music: attached
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
      app.kubernetes.io/name: jellyfin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jellyfin
        app.kubernetes.io/name: jellyfin
    spec:
      enableServiceLinks: false
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:12
        env:
        - name: LIBVA_DRIVER_NAME
          value: "iHD"
        - name: JELLYFIN_DATA_DIR
          value: "/config"
        - name: JELLYFIN_METADATA_DIR
          value: "/config/config/metadata"
        - name: JELLYFIN_PublishedServerUrl
          value: "internal=http://habiflix.lan, external=habiflix.citocafecito.work"
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        ports:
        - containerPort: 8096
          protocol: TCP
        - containerPort: 8920
          protocol: TCP
        - containerPort: 7359
          protocol: UDP
        - containerPort: 1900
          protocol: UDP
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        securityContext:
          privileged: true
          capabilities:
            drop: ["ALL"]
            add: ["SYS_RAWIO", "SETPCAP", "SYS_ADMIN"]
        startupProbe:
          httpGet:
            path: /health
            port: 8096
          failureThreshold: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: dri 
          mountPath: /dev/dri
          readOnly: false
        - name: shm
          mountPath: /dev/shm
        - name: config
          mountPath: /config
        - name: assets
          mountPath: /jellyfin/jellyfin-web/custom
        - name: configmap
          mountPath: /config/config/branding.xml
          subPath: branding.xml
        - name: configmap
          mountPath: /config/config/livetv.xml
          subPath: livetv.xml
        - name: media
          mountPath: /media
        - name: music
          mountPath: /music
        - name: playlists
          mountPath: /music/playlists
          readOnly: true
      nodeSelector:
        kubernetes.io/hostname: castillo
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        supplementalGroups: [44, 107, 992]
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
      - name: config
        hostPath:
          path: /mnt/jellyfin
          type: DirectoryOrCreate
      - name: configmap
        configMap:
          name: jellyfin-config
      - name: assets
        configMap:
          name: jellyfin-web
      - name: media
        hostPath:
          path: /media
          type: DirectoryOrCreate
      - name: music
        hostPath:
          path: /mnt/music
      - name: playlists
        configMap:
          name: shared-playlists