apiVersion: apps/v1
kind: Deployment
metadata:
  name: puppysignal-webapp
  labels:
    app: puppysignal-webapp
    app.kubernetes.io/name: puppysignal-webapp
    app.kubernetes.io/instance: puppysignal-stack
    app.kubernetes.io/part-of: puppysignal-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: puppysignal-webapp
      app.kubernetes.io/name: puppysignal-webapp
      app.kubernetes.io/instance: puppysignal-stack
      app.kubernetes.io/part-of: puppysignal-stack
  template:
    metadata:
      labels:
        app: puppysignal-webapp
        app.kubernetes.io/name: puppysignal-webapp
        app.kubernetes.io/instance: puppysignal-stack
        app.kubernetes.io/part-of: puppysignal-stack
    spec:
      containers:
      - name: puppysignal-webapp
        image: ghcr.io/citocafecito-homelab/puppysignal-webapp:latest
        env: 
          - name: VITE_API_BASE_PATH
            value: "/api"
        ports:
        - containerPort: 3000
