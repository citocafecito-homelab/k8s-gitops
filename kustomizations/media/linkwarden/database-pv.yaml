apiVersion: v1
kind: PersistentVolume
metadata:
  name: linkwarden-postgresql-pv
spec:
  capacity:
    storage: "5Gi"
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: /mnt/linkwarden-postgresql
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkwarden-postgresql-pvc
  namespace: media
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: "5Gi"
  storageClassName: ""
  volumeName: linkwarden-postgresql-pv
