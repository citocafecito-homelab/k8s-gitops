apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fusionauth
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: auth.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: fusionauth
              port:
                number: 9011