apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisparr
  labels:
    app: whisparr
    app.kubernetes.io/name: whisparr
    app.kubernetes.io/part-of: streaming-stack
    tier: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisparr
      app.kubernetes.io/name: whisparr
  template:
    metadata:
      labels:
        app: whisparr
        app.kubernetes.io/name: whisparr
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: whisparr
        image: ghcr.io/hotio/whisparr:v2
        ports:
        - containerPort: 6969
        env:
        - name: WEBUI_PORTS
          value: "6969/tcp"
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        resources:
          requests:
            memory: 64Mi
            cpu: 5m
        livenessProbe:
          tcpSocket:
            port: 6969
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          tcpSocket:
            port: 6969
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        - name: media
          mountPath: /media
      nodeSelector:
        kubernetes.io/hostname: castillo
      securityContext:
        fsGroup: 1000
      volumes:
      - name: config
        hostPath:
          path: /mnt/whisparr
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
      - name: media
        hostPath:
          path: /media
          type: DirectoryOrCreate