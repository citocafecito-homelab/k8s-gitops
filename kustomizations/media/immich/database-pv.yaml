apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-postgresql-pv
spec:
  capacity:
    storage: "5Gi"
  accessModes:
  - ReadWriteOnce
  hostPath:
    path: /mnt/immich-postgresql
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  volumeMode: Filesystem
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgresql-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: "5Gi"
  storageClassName: ""
  volumeName: immich-postgresql-pv
