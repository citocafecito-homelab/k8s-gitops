apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streaming
  namespace: streaming
spec:
  rules:
    - host: homeassistant.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: home-assistant
                port:
                  number: 8123
    - host: musicassistant.lan
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: music-assistant
                port:
                  number: 8095