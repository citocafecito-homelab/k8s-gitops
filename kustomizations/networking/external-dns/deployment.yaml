apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: external-dns
  template:
    metadata:
      labels:
        app: external-dns
      annotations:
        app.kubernetes.io/documentation: "https://github.com/kubernetes-sigs/external-dns/blob/master/docs/tutorials/pihole.md"
    spec:
      serviceAccountName: external-dns
      containers:
      - name: external-dns
        image: registry.k8s.io/external-dns/external-dns:v0.20.0
        args:
          - --source=service
          - --source=ingress
          - --policy=upsert-only
          - --provider=pihole
        env:
        - name:  EXTERNAL_DNS_PIHOLE_SERVER
          value: "http://pihole.networking.svc.cluster.local"
        - name: EXTERNAL_DNS_PIHOLE_API_VERSION
          value: "6"
        - name: EXTERNAL_DNS_PIHOLE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pihole-secret
              key: WEBPASSWORD
      securityContext:
        fsGroup: 65534 