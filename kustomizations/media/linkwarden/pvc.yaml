apiVersion: v1
kind: PersistentVolume
metadata:
  name: linkwarden-pv
spec:
  capacity:
    storage: "5Gi"
  accessModes:
  - ReadWriteMany
  hostPath:
    path: /mnt/linkwarden
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: linkwarden-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  volumeName: linkwarden-pv