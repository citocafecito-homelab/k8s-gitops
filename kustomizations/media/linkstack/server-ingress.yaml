  #     - path: /
  #       pathType: Prefix
  #       backend:
  #         service:
  #           name: linkstack-proxy
  #           port:
  #             number: 80
  - host: linkstack.citocafecito.work
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: linkstack
            port:
              number: 80
