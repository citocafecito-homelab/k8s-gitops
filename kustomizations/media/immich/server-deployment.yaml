apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich
  labels:
    tier: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: immich
      app.kubernetes.io/name: immich
  template:
    metadata:
      labels:
        app: immich
        app.kubernetes.io/name: immich
        app.kubernetes.io/part-of: immich
      annotations:
        app.kubernetes.io/documentation: "https://github.com/immich-app/immich"
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault"
        vault.hashicorp.com/agent-inject-secret-immich: "secret/data/immich"
        vault.hashicorp.com/agent-inject-template-immich: |
          {{- with secret "secret/data/immich" -}}
          {{ printf "postgresql://%s:%s@immich-postgresql:5432/%s" .Data.data.DATABASE_USERNAME .Data.data.DATABASE_PASSWORD .Data.data.DATABASE_NAME | writeToFile "/vault/secrets/database" "vault" "vault" "0644"}}
          {{- end -}}
    spec:
      enableServiceLinks: false
      serviceAccountName: immich
      containers:
      - name: immich
        image: ghcr.io/immich-app/immich-server:release
        ports:
        - containerPort: 2283
        env:
        - name: DB_URL_FILE
          value: "/vault/secrets/database"
        envFrom:
        - configMapRef:
            name: immich-config
        resources:
          requests:
            cpu: 1
            memory: 1Gi
          limits:
            cpu: 2          
            memory: 4Gi
        securityContext:
          privileged: true 
        volumeMounts:
        - mountPath: /dev/dri
          name: dri
        - name: immich-data
          mountPath: /data
      nodeSelector:
        kubernetes.io/hostname: catimore
      securityContext:
        fsGroup: 1000
        supplementalGroups: [44, 107, 992]
      volumes:
      - name: dri
        hostPath:
          path: /dev/dri
      - name: immich-data
        hostPath:
          path: /media/memories
          type: DirectoryOrCreate