apiVersion: apps/v1
kind: Deployment
metadata:
  name: deluge
  labels:
    app: deluge
    app.kubernetes.io/name: deluge
    app.kubernetes.io/instance: streaming-stack
    app.kubernetes.io/part-of: streaming-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deluge
      app.kubernetes.io/name: deluge
      app.kubernetes.io/instance: streaming-stack
      app.kubernetes.io/part-of: streaming-stack
  template:
    metadata:
      labels:
        app: deluge
        app.kubernetes.io/name: deluge
        app.kubernetes.io/instance: streaming-stack
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: deluge
        image: lscr.io/linuxserver/deluge:latest
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        ports:
        - containerPort: 8112
          name: webui
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
      volumes:
      - name: config
        hostPath:
          path: /mnt/deluge
          type: DirectoryOrCreate
      - name: downloads
        persistentVolumeClaim:
          claimName: downloads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: deluge
spec:
  ports:
    - port: 8112
      targetPort: 8112
      name: webui
    - port: 6881
      targetPort: 6881
      protocol: TCP
      name: torrent-tcp
    - port: 6881
      targetPort: 6881
      protocol: UDP
      name: torrent-udp
  selector:
    app: deluge
---
apiVersion: v1
kind: Service
metadata:
  name: deluge-lb
  annotations:
    external-dns.alpha.kubernetes.io/hostname: deluge.lan
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.36
  ports:
  - name: webui
    port: 80
    targetPort: 9091
    protocol: TCP
  - name: tcp
    port: 51413
    targetPort: 51413
    protocol: TCP
  - name: udp
    port: 51413
    targetPort: 51413
    protocol: UDP
  selector:
    app: deluge