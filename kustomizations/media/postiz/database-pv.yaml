apiVersion: v1
kind: PersistentVolume
metadata:
  name: postiz-mysql-pv
spec:
  capacity:
    storage: "5Gi"
  accessModes:
  - ReadWriteOnce
  storageClassName: manual
  hostPath:
    path: /mnt/postiz-mysql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postiz-mysql-pvc
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: "5Gi"
