apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  labels:
    app: flaresolverr
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/part-of: streaming-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
        app.kubernetes.io/name: flaresolverr
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: flaresolverr
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
        - containerPort: 8191
        env:
        - name: CAPTCHA_SOLVER
          value: 'hcaptcha-solver'
        - name: BROWSER
          value: "chrome"
        - name: CHROME_URL
          value: "http://chrome.core.svc.cluster.local:3000"
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8191
          initialDelaySeconds: 90
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 8191
          initialDelaySeconds: 45
          periodSeconds: 15
          timeoutSeconds: 5
      nodeSelector:
        kubernetes.io/hostname: caturra
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  labels:
    app: flaresolverr
    app.kubernetes.io/name: flaresolverr
    app.kubernetes.io/part-of: streaming-stack
spec:
  selector:
    app: flaresolverr
  ports:
  - name: http
    port: 8191
    targetPort: 8191
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flaresolverr
spec:
  rules:
  - host: flaresolverr.citocafecito.work
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flaresolverr
            port:
              number: 8191
