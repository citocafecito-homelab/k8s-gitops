apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fusionauth-postgresql
spec:
  serviceName: fusionauth-postgresql
  replicas: 0
  selector:
    matchLabels:
      app: fusionauth-postgresql
      app.kubernetes.io/name: fusionauth-postgresql
  template:
    metadata:
      labels:
        app: fusionauth-postgresql
        app.kubernetes.io/name: fusionauth-postgresql
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault"
        vault.hashicorp.com/agent-inject-secret-password: "secret/data/fusionauth"
        vault.hashicorp.com/agent-inject-template-fusionauth: |
          {{- with secret "secret/data/fusionauth" -}}
          {{ .Data.data.DATABASE_USERNAME | writeToFile "/vault/secrets/AUTH_USERNAME" "vault" "vault" "0644" }}
          {{ .Data.data.DATABASE_PASSWORD | writeToFile "/vault/secrets/AUTH_PASSWORD" "vault" "vault" "0644" }}
          {{- end -}}
    spec:
      containers:
      - name: postgres
        image: postgres:18
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: fusionauth-database
              key: DATABASE_NAME
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: fusionauth-database
              key: DATABASE_USERNAME
        - name: POSTGRES_PASSWORD_FILE
          value: /vault/secrets/password
        volumeMounts:
        - name: fusionauth-postgresql-storage
          mountPath: /var/lib/postgresql
        livenessProbe:
          exec:
            command: [ "pg_isready", "-U", "$POSTGRES_USER" ]
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 3
        readinessProbe:
          exec:
            command: [ "pg_isready", "-U", "$POSTGRES_USER" ]
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
      nodeSelector:
        kubernetes.io/hostname: catuai
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: fusionauth-postgresql-storage
        persistentVolumeClaim:
          claimName: fusionauth-postgresql-pvc
