apiVersion: apps/v1
kind: Deployment
metadata:
  name: seerr
  labels:
    app: seerr
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: streaming-stack
    tier: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seerr
      app.kubernetes.io/name: seerr
  template:
    metadata:
      labels:
        app: seerr
        app.kubernetes.io/name: seerr
        app.kubernetes.io/part-of: streaming-stack
    spec:
      containers:
      - name: seerr
        image: ghcr.io/seerr-team/seerr:latest
        ports:
        - containerPort: 5055
        envFrom:
        - configMapRef:
            name: streaming-stack-config
        resources:
          requests:
            memory: 64Mi
            cpu: 5m
        livenessProbe:
          httpGet:
            path: /api/v1/status
            port: 5055
          initialDelaySeconds: 20
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/v1/status
            port: 5055
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          privileged: false
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: seerr-config
          mountPath: /app/config
      nodeSelector:
        kubernetes.io/hostname: castillo
      volumes:
      - name: seerr-config
        hostPath:
          path: /mnt/seerr
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: seerr
  labels:
    app: seerr
    app.kubernetes.io/name: seerr
    app.kubernetes.io/part-of: streaming-stack
spec:
  selector:
    app: seerr
  ports:
  - name: http
    port: 5055
    targetPort: 5055
---
apiVersion: v1
kind: Service
metadata:
  name: seerr-lb
  annotations:
    external-dns.alpha.kubernetes.io/hostname: seerr.lan
  labels:
    type: LoadBalancer
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.1.41
  selector:
    app: seerr
  ports:
  - name: webui
    protocol: TCP
    port: 80
    targetPort: 5055
  - name: http
    port: 5055
    targetPort: 5055
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr
spec:
  ingressClassName: cloudflare-tunnel
  rules:
  - host: seerr.citocafecito.work
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: seerr
              port:
                number: 5055