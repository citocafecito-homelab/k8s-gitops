apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: streaming

generatorOptions:
  disableNameSuffixHash: true
  
configMapGenerator:
  - name: transmission-scripts
    files:
    - scripts/01-setup-config.sh
    - scripts/update-port.sh
    - scripts/torrent-added.sh
    - scripts/torrent-finished.sh
    - scripts/torrent-completed.sh

  - name: transmission-jobs
    files:
    - scripts/tagger-daemon.sh

resources:
- sa.yaml
- deployment.yaml
- svc.yaml
- ingress.yaml
- cronjobs/tagger.yaml