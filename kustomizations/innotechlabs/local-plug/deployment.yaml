apiVersion: apps/v1
kind: Deployment
metadata:
  name: localplug
  namespace: innotechlabs
  labels:
    app.kubernetes.io/name: localplug
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: localplug
  template:
    metadata:
      labels:
        app.kubernetes.io/name: localplug
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "vault"
        vault.hashicorp.com/agent-inject-secret-environment.env: "secret/data/innotechlabs/localplug"
        vault.hashicorp.com/agent-inject-template-environment.env: |
          {{- with secret "secret/data/innotechlabs/localplug" -}}
          {{- range $key, $value := .Data.data }}
          {{ $key }}={{ $value }}
          {{- end }}
          {{- end }}
    spec:
      serviceAccountName: innotechlabs
      enableServiceLinks: false
      containers:
      - name: localplug
        image: ghcr.io/innotechlabs01/localplug:latest
        imagePullPolicy: IfNotPresent
        command:
        - node
        - --env-file=/vault/secrets/environment.env
        - server.js
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: GUID
          value: "1000"
        - name: UID
          value: "1000"
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: localplug-data
          mountPath: /app/data
      nodeSelector:
        kubernetes.io/hostname: catimore
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: localplug-data
          hostPath:
            path: /mnt/localplug