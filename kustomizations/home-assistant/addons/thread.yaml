# Check https://openthread.io/guides/border-router/form-network?hl=es-419 for more context
## Run on node if state is Detached
# > avahi-browse -rt _matterc._udp
# > avahi-browse -rt _matter._tcp
#
## Run in pod if restarts
# > kubectl -n home-assistant exec -it openthread-0 -c otbr -- ot-ctl
#
## Setup Thread Network
# > state
# > ifconfig up
# > thread start
#
# Finish 
# > dataset active commit
# TLV Dataset info
# > dataset active -x
apiVersion: v1
kind: ConfigMap
metadata:
  name: otbr-env
data:
  OT_RCP_DEVICE: "spinel+hdlc+uart:///dev/ttyUSB0?uart-baudrate=115200"
  # Caturra OT_INFRA_IF: "enp2s0"
  OT_INFRA_IF: "enp1s0"
  OT_THREAD_IF: "wpan0"
  OT_LOG_LEVEL: "7"
  OT_REST_LISTEN_ADDR: "0.0.0.0"
  OTBR_USE_NCP_SETTINGS: "false"
  MDNS_RESPONDER: "disabled"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openthread
spec:
  replicas: 0
  selector:
    matchLabels:
      app: openthread
      app.kubernetes.io/name: openthread
  serviceName: openthread
  template:
    metadata:
      labels:
        app: openthread
        app.kubernetes.io/name: openthread
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: Always
      containers:
      - name: otbr
        image: openthread/border-router:latest
        envFrom:
        - configMapRef:
            name: otbr-env
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 512Mi
        securityContext:
          privileged: true
          runAsUser: 0
          capabilities:
            add:
            - NET_ADMIN
            - SYS_RAWIO
        volumeMounts:
        - name: otbr-data
          mountPath: /data
        - name: rcp
          mountPath: /dev/ttyUSB0
        - name: tun
          mountPath: /dev/net/tun
      nodeSelector:
        kubernetes.io/hostname: catuai
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      volumes:
      - name: otbr-data
        hostPath:
          path: /mnt/openthread
          type: DirectoryOrCreate
      - name: rcp
        hostPath:
          path: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
          type: CharDevice
      - name: tun
        hostPath:
          path: /dev/net/tun
---
apiVersion: v1
kind: Service
metadata:
  name: openthread
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: openthread
  ports:
  - name: api
    port: 8081
    targetPort: 8081
  - name: http
    port: 5580
    targetPort: 5580
