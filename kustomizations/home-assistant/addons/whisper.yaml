apiVersion: v1
kind: PersistentVolume
metadata:
  name: whisper-pv
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 2Gi
  hostPath:
    path: /mnt/whisper
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: whisper-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whisper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whisper
      app.kubernetes.io/name: whisper
  template:
    metadata:
      labels:
        app: whisper
        app.kubernetes.io/name: whisper
      annotations:
        app.kubernetes.io/documentation: https://docs.linuxserver.io/images/docker-faster-whisper/#docker-cli-click-here-for-more-info
    spec:
      containers:
      - name: whisper
        image: lscr.io/linuxserver/faster-whisper:latest
        env:
          - name: PUID
            value: "1000"
          - name: PUID
            value: "1000"
          - name: TZ
            value: "America/Bogota"
          - name: WHISPER_BEAM
            value: "2"
          - name: WHISPER_LANG
            value: "es"
          - name: WHISPER_MODEL
            value: "large-v3-turbo"
          - name: WHISPER_COMPUTE_TYPE
            value: "int8"
          - name: WHISPER_CPU_THREADS
            value: "4"
        ports:
        - containerPort: 10300
        resources:
          requests:
            cpu: 2
            memory: "2Gi"
          limits:
            cpu: 4
            memory: "5Gi"
        volumeMounts:
        - name: whisper-config
          mountPath: /config
      nodeSelector:
        kubernetes.io/hostname: castillo
      volumes:
      - name: whisper-config
        persistentVolumeClaim:
          claimName: whisper-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: whisper
spec:
  selector:
    app: whisper
  ports:
  - name: wyoming
    port: 10300
    targetPort: 10300
    protocol: TCP
