apiVersion: v1
kind: PersistentVolume
metadata:
  name: mixpost-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 192.168.1.10
    path: /mnt/mixpost
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mixpost-pvc
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
  volumeName: mixpost-pv