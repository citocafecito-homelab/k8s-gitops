# find /mnt/music -type f -name "*.mp3" -exec bpm-tag -f {} \;
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  labels:
    app: navidrome
    tier: disposable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: navidrome
      app.kubernetes.io/name: navidrome
  template:
    metadata:
      labels:
        app: navidrome
        app.kubernetes.io/name: navidrome
    spec:
      containers:
      - name: navidrome
        image: deluan/navidrome:latest
        ports:
        - containerPort: 4533
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
            amd.com/gpu: "1"
          limits:
            cpu: 500m
            memory: 1Gi
            amd.com/gpu: "1"
        envFrom:
        - configMapRef:
              name: navidrome-config
        env:
        - name: ND_LASTFM_APIKEY
          valueFrom:
            secretKeyRef:
              name: navidrome-lastfm-secret
              key: ND_LASTFM_APIKEY
        - name: ND_LASTFM_SECRET
          valueFrom:
            secretKeyRef:
              name: navidrome-lastfm-secret
              key: ND_LASTFM_SECRET
        securityContext:
          privileged: false
        volumeMounts:
        - name: cache
          mountPath: /data/cache
        - name: dri
          mountPath: /dev/dri
        - name: navidrome-data
          mountPath: /data
        - name: navidrome-music
          mountPath: /music
          readOnly: true
        - name: playlists
          mountPath: /music/playlists
      nodeSelector:
        kubernetes.io/hostname: catimore
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        supplementalGroups: [44, 107, 992]
      volumes:
      - name: cache
        emptyDir:
          medium: Memory
          sizeLimit: "1Gi"
      - name: dri
        hostPath:
          path: /dev/dri
          type: Directory
      - name: navidrome-data
        persistentVolumeClaim:
          claimName: navidrome-pvc
      - name: navidrome-music
        persistentVolumeClaim:
          claimName: music-pvc
      - name: playlists
        configMap:
          name: shared-playlists